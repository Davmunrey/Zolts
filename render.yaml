# One-click deployment on Render: a managed Postgres, the API, and the worker.
#
# Two services from one image, because the API and the worker share the code
# and differ only in the command. Migrations run before either starts.
#
# The application connects as a role that cannot bypass row-level security. The
# managed database issues one role, so the second role is created by the
# pre-deploy command; running the application as the owner would pass every
# test and remove the second lock.
databases:
  - name: zolts-postgres
    databaseName: zolts
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: zolts-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    preDeployCommand: python3 -m runtime.cli migrate
    envVars: &shared
      - key: ZOLTS_DATABASE_URL
        fromDatabase: {name: zolts-postgres, property: connectionString}
      - key: ZOLTS_APP_DATABASE_URL
        sync: false          # set once the zolts_app role exists; see docs/20
      - key: ZOLTS_SECRET_KEY
        generateValue: true  # seals connector credentials; losing it means re-entering them
      - key: ZOLTS_ENV
        value: production

  - type: worker
    name: zolts-worker
    runtime: docker
    plan: starter
    dockerCommand: python3 -m runtime.cli worker
    envVars: *shared
