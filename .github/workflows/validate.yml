name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jsonschema pytest
      - name: Validate GTM programs against the JSON Schema
        run: python3 scripts/validate.py
      - name: Run the reference core test suite
        run: python3 -m pytest tests/ -q
        env:
          PYTHONPATH: .
      - name: Benchmark the waterfall optimiser
        run: python3 scripts/benchmark_waterfall.py
        env:
          PYTHONPATH: .
