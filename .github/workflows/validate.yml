name: validate-gtm-programs

on:
  push:
    paths: ['examples/**', 'scripts/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['examples/**', 'scripts/**', '.github/workflows/validate.yml']

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: Validar programas GTM contra el JSON Schema
        run: python3 scripts/validate.py
