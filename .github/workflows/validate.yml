name: validate

on:
  push:
    branches: [main]        # branch pushes are covered by pull_request; without
  pull_request:             # this split every push ran the suite twice

jobs:
  test:
    runs-on: ubuntu-latest

    # The runtime tests need a real Postgres. They are skipped rather than
    # faked when one is absent, so without this service CI would go green
    # having verified none of the isolation properties.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zolts
          POSTGRES_PASSWORD: zolts
          POSTGRES_DB: zolts
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PYTHONPATH: .
      ZOLTS_TEST_DATABASE_URL: postgresql://zolts:zolts@127.0.0.1:5432/zolts
      ZOLTS_TEST_APP_DATABASE_URL: postgresql://zolts_app:zolts_app@127.0.0.1:5432/zolts

    steps:
      - uses: actions/checkout@v5        # v4 targets the deprecated Node 20
      - uses: actions/setup-python@v6    # v5 targets the deprecated Node 20
        with:
          python-version: '3.11'
      - run: pip install pyyaml jsonschema pytest playwright
      - run: pip install -r runtime/requirements.txt

      # The spend guard is a Node package. The agent tests skip without it,
      # and a skipped cost-control test is the kind CI must not report green.
      - run: npm install -g @trazum/mcp@2.3.0

      - name: Create the non-owning application role
        run: |
          psql "$ZOLTS_TEST_DATABASE_URL" -c \
            "create role zolts_app login password 'zolts_app'"
      - name: Validate GTM programs, blueprints and CRM mappings against their schemas
        run: python3 scripts/validate.py
      # `pipefail` is not the default shell's, and without it `tee` decides the
      # step's exit status: a failing suite would report green.
      - name: Run the test suite
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q -rs | tee /tmp/tests.log

      - name: Run declarative program tests
        run: python3 scripts/run_program_tests.py
      - name: Check the built site is in sync with its source
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- site vercel.json \
            || { echo "::error::site/ is stale — run PYTHONPATH=. python3 scripts/build_site.py and commit"; exit 1; }

      # Every guard here was watched to fail once, by hand, the day it was
      # written. This is that verification made repeatable: break each one and
      # require a test to notice. It runs in seconds because a biting mutation
      # stops at the first failure.
      - name: Break each guard and require a test to notice
        run: python3 scripts/mutation_check.py

      # The other half of VER-1, and a different claim: the step above
      # re-proves a curated list, this one samples the mutant space and
      # reports what share the tests catch. Eight here because each mutant
      # costs a suite run; the number that goes in `docs/22` comes from a
      # larger sample run by hand. Deliberately not a gate — a sampled rate
      # moves between runs, and a build that failed on it would be a build
      # that teaches the team to lower the bar.
      - name: Sample the mutant space and report what the tests catch
        run: python3 scripts/mutation_coverage.py --sample 8

      - name: Benchmark the waterfall optimiser
        run: python3 scripts/benchmark_waterfall.py

      # A suite that skips every Postgres test still reports green, and the
      # properties it skipped — tenant isolation above all — are the ones a
      # stub cannot verify. The run above reports its skips, so this reads
      # them rather than running the same 189 tests a second time.
      - name: Refuse a green run that skipped the Postgres tests
        run: |
          if grep -q "ZOLTS_TEST_DATABASE_URL is not set" /tmp/tests.log; then
            echo "::error::the Postgres tests were skipped; this run proves nothing"
            exit 1
          fi
          echo "the Postgres tests ran: $(python3 -m pytest tests/ -q -m db \
            --collect-only 2>/dev/null | grep -oP '^\d+(?=/)') selected by -m db"

      - name: Refuse a green run that skipped the agent tests
        run: |
          if ! command -v trazum-mcp >/dev/null; then
            echo "::error::trazum-mcp is missing, so the spend-guard tests did not run"
            exit 1
          fi

      # The console was built, served, tested against its view model and
      # rendered headlessly from the static build — and still answered 401 to
      # anyone who typed its URL. Every check passed; nobody had opened it.
      - name: Open the console the way an operator does
        run: |
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser_console.py
        env:
          ZOLTS_DATABASE_URL: postgresql://zolts:zolts@127.0.0.1:5432/zolts
          ZOLTS_APP_DATABASE_URL: postgresql://zolts_app:zolts_app@127.0.0.1:5432/zolts
          ZOLTS_SECRET_KEY: ci-only-not-a-real-key

      - name: Smoke the runtime end to end
        run: python3 scripts/smoke_runtime.py
        env:
          ZOLTS_DATABASE_URL: postgresql://zolts:zolts@127.0.0.1:5432/zolts
          ZOLTS_APP_DATABASE_URL: postgresql://zolts_app:zolts_app@127.0.0.1:5432/zolts
          ZOLTS_SECRET_KEY: ci-only-not-a-real-key

  # The image was shipped once without the data the runtime reads. It started,
  # reported healthy, and seeded a tenant with no programs. Nothing failed.
  # So the image is now built and run, not just written.
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zolts
          POSTGRES_PASSWORD: zolts
          POSTGRES_DB: zolts
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DB: postgresql://zolts:zolts@127.0.0.1:5432/zolts
      APP_DB: postgresql://zolts_app:zolts_app@127.0.0.1:5432/zolts
      ZOLTS_SECRET_KEY: ci-only-not-a-real-key

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t zolts:ci .

      # The compose stack creates this role from an initdb script. A service
      # container has no initdb hook, and `migrate` grants to it, so without
      # this the first command inside the image fails.
      - name: Create the non-owning application role
        run: psql "$DB" -c "create role zolts_app login password 'zolts_app'"

      - name: Migrate from inside the container
        run: |
          docker run --rm --network host -e ZOLTS_DATABASE_URL="$DB" \
            -e ZOLTS_APP_DATABASE_URL="$APP_DB" \
            -e ZOLTS_SECRET_KEY zolts:ci python3 -m runtime.cli migrate

      - name: A first run inside the container must seed the programs it claims
        run: |
          docker run --rm --network host -e ZOLTS_DATABASE_URL="$DB" \
            -e ZOLTS_APP_DATABASE_URL="$APP_DB" \
            -e ZOLTS_SECRET_KEY zolts:ci \
            python3 -m runtime.cli quickstart --slug ci-demo > quickstart.json
          python3 - <<'PY'
          import json, sys
          out = json.load(open("quickstart.json"))
          programs = out["programs"]
          if not programs:
              sys.exit("::error::quickstart seeded no programs and still reported "
                       "success — the image is missing examples/programs")
          print(f"seeded {len(programs)}: {[p['key'] for p in programs]}")
          open("key.txt", "w").write(out["api_key"])
          PY

      - name: Preflight must pass in the container, and must block a bad config
        run: |
          docker run --rm --network host -e ZOLTS_DATABASE_URL="$DB" \
            -e ZOLTS_APP_DATABASE_URL="$APP_DB" -e ZOLTS_SECRET_KEY \
            -e ZOLTS_ENV=development zolts:ci python3 -m runtime.cli preflight
          # The same runtime, marked production with the CI secret, must refuse.
          if docker run --rm --network host -e ZOLTS_DATABASE_URL="$DB" \
               -e ZOLTS_APP_DATABASE_URL="$APP_DB" -e ZOLTS_SECRET_KEY \
               -e ZOLTS_ENV=production zolts:ci python3 -m runtime.cli preflight; then
            echo "::error::preflight passed a production deployment using the CI secret key"
            exit 1
          fi
          echo "preflight blocks a production deploy with a published key"

      - name: The API and the console must answer from inside the container
        run: |
          docker run -d --name api --network host \
            -e ZOLTS_DATABASE_URL="$DB" -e ZOLTS_APP_DATABASE_URL="$APP_DB" \
            -e ZOLTS_SECRET_KEY zolts:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          code=$(curl -s -o console.html -w '%{http_code}' \
            -H "x-api-key: $(cat key.txt)" http://127.0.0.1:8000/console)
          test "$code" = "200" || { echo "::error::/console returned $code"; docker logs api; exit 1; }
          test -s console.html || { echo "::error::/console returned an empty body"; exit 1; }
          echo "console rendered $(wc -c < console.html) bytes"

      # The image's default CMD is what the steps above exercise. `fly.toml`
      # runs neither of its processes with that command — it declares its own
      # table, and those two strings are what a deploy executes. A test parses
      # them; this runs them, because a command that parses can still fail on
      # a missing file, an unset variable or a wrong working directory.
      - name: The worker command from fly.toml must run inside the container
        run: |
          worker=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("fly.toml", "rb"))["processes"]["worker"])
          PY
          )
          echo "fly.toml worker: $worker"
          # `--once` so it drains and exits rather than looping; the command
          # itself is the one from the process table.
          docker run --rm --network host -e ZOLTS_DATABASE_URL="$DB" \
            -e ZOLTS_APP_DATABASE_URL="$APP_DB" -e ZOLTS_SECRET_KEY \
            zolts:ci $worker --once

      - name: The api command from fly.toml must serve on the port Fly routes to
        run: |
          api=$(python3 - <<'PY'
          import tomllib
          fly = tomllib.load(open("fly.toml", "rb"))
          print(fly["processes"]["api"], fly["http_service"]["internal_port"])
          PY
          )
          command="${api% *}"; port="${api##* }"
          echo "fly.toml api: $command on $port"
          docker run -d --name flyapi --network host \
            -e ZOLTS_DATABASE_URL="$DB" -e ZOLTS_APP_DATABASE_URL="$APP_DB" \
            -e ZOLTS_SECRET_KEY zolts:ci $command
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:$port/health" > /dev/null && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:$port/health" | grep -q '"status":"ok"' \
            || { echo "::error::the fly api command does not answer on $port"; \
                 docker logs flyapi; exit 1; }
          echo "the deployed command serves on the port fly.toml routes to"

      - name: Show the container's logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs flyapi || true
