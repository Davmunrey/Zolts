name: deploy-cloudflare-pages

# Cloudflare Pages deployment. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account the Pages project lives in
# Until both exist the job is skipped rather than failing the run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # The credential check comes first. Building a site that cannot be
      # deployed spends a runner and, when the build fails, reports a
      # deployment failure for a deployment that was never going to happen —
      # which is exactly what it did the first time this ran on main.
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Explain the skip
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo "::notice::Cloudflare secrets are not set, so nothing was deployed."
          echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable this job."

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: '3.11'

      # The build imports the reference core, which reads YAML and validates
      # against a JSON Schema. Without these the build fails on the import,
      # not on anything to do with deployment.
      - name: Install build dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pip install pyyaml jsonschema

      - name: Build the static site
        if: steps.creds.outputs.ready == 'true'
        run: python3 scripts/build_site.py

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=zolts --branch=main
