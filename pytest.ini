[pytest]
# `db` marks the tests that need a real Postgres. They are skipped, never
# faked, when one is absent: an isolation property verified against a stub is
# not verified at all. `pytest -m db` selects them; `pytest -m "not db"` is
# what a contributor without a database runs.
markers =
    db: requires a real Postgres (ZOLTS_TEST_DATABASE_URL)
