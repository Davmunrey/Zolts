# Archetype: Ecommerce / DTC (B2C) — shows the same runtime serves B2C.
# Here the "account" is a household or customer, the signal is purchase
# behaviour, and the dominant constraint is consent (ePrivacy), not
# legitimate interest.
apiVersion: zolts/v1
kind: Program
metadata:
  key: replenishment-winback
  version: 1.2.0
  name: Replenishment winback
  blueprint: ecommerce-dtc
spec:
  trigger:
    events:
      - signal: commerce.replenishment_due
        where: "payload.days_since_purchase >= payload.expected_cycle_days * 0.85"
      - signal: commerce.cart_abandoned
        where: "payload.value_eur >= 45"
    combine: any_within
    window: 3d
    dedupe: {key: person_id, cooldown: 21d}

  audience:
    # B2C, so consent is mandatory and is read from the person's own consent
    # state rather than from a column a tenant might forget to populate.
    sql: |
      select p.id as person_id
      from person p
      where jsonb_path_exists(p.attributes, '$.lifetime_orders ? (@ >= 1)')
        and jsonb_path_exists(
              p.attributes, '$.predicted_churn_risk ? (@ >= 0.3 && @ <= 0.85)')
        and p.consent_state ->> 'email' = 'consent'
        and p.country in ('ES','PT','FR','IT')
        and not exists (
              select 1 from suppression s
               where s.scope = 'person' and s.value = p.id::text)
  enrich:
    person:
      require: []                                   # first-party data: zero enrichment cost
      skip_if_known: true

  score:
    formula: |
      0.40 * predicted_repurchase_probability
      + 0.30 * customer_ltv_percentile
      + 0.20 * margin_of_recommended_sku
      + 0.10 * recency_decay
    floor: 40

  route:
    tiers:
      - {key: t1, when: "customer_ltv_percentile >= 0.9", capacity_per_week: 5000}
      - {key: t2, when: "score >= 40", capacity_per_week: 100000}

  plays:
    t1:
      template: vip-winback
      auto_send: true
      auto_send_requires: {eval_score: 0.90}
      steps:
        - {step: email_1, channel: email, template: vip-personal, wait: 0d}
        - {step: whatsapp, channel: whatsapp, wait: 2d, template: vip-reminder}
        - {step: ads_exclusion, channel: ads, action: exclude_from_prospecting}
    t2:
      template: standard-winback
      auto_send: true
      auto_send_requires: {eval_score: 0.88}
      steps:
        - {step: email_1, channel: email, template: replenish, wait: 0d}
        - {step: email_2, channel: email, template: incentive-10, wait: 4d}
        - {step: ads_retarget, channel: ads, platform: meta, duration: 14d}

  policy:
    inherit: tenant_default
    overrides:
      channels_require_basis: {email: consent, whatsapp: consent, ads: consent}
      max_touches_per_person_per_week: 2

  experiment:
    holdout_pct: 10
    unit: person
    primary_metric: net_revenue_28d          # net of discount: avoids cannibalisation
    # None declared, deliberately. Margin per order is the guardrail this
    # programme wants — a winback that sells at a discount raises revenue and
    # loses money — and the runtime records no margin (D-76). Cost is guarded
    # instead, by the budget block below and by the report's cost per
    # incremental meeting against the ceiling that block declares.
    guardrail_metrics: []

  budget: {monthly_credits: 8000, max_cost_per_person: 0.08, on_exceed: throttle}

  exit:
    # `won` rather than `purchase`: the runtime records a completed sale as
    # `won` (`inbound.CONVERSION`, from the provider's `deal.won`), and it is
    # what this programme's own `net_revenue_28d` counts. `purchase` was
    # written by nothing, so this rule ended nothing either — found by the
    # lint added with D-77, on its first run.
    - {when: "outcome.type == 'won'", reason: converted}
    # An explicit no. `reply_negative` is what triage writes for one, and it is
    # the rule that makes `suppress` mean something: the sequence stops and the
    # person is added to the suppression list. This used to test for
    # `outcome.type == 'unsubscribe'`, which nothing ever writes — a real
    # unsubscribe is suppressed, exited and cancelled by the runtime before any
    # outcome is recorded, so the rule could not fire and the lint that checked
    # for it was answered by nothing (D-77).
    - {when: "outcome.type == 'reply_negative'", reason: declined, suppress: true}
    - {when: "days_in_program > 18", reason: exhausted}
