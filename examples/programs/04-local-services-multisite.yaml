# Archetype: local services / multi-site franchises (clinics, workshops, retail).
# Thesis: the useful signal is not digital intent but observable operational
# change (a new site, a drop in reviews, a change of manager). Territory and
# local sales capacity are the real constraint.
apiVersion: zolts/v1
kind: Program
metadata:
  key: new-site-and-reputation
  version: 1.0.0
  name: New site and reputation
  blueprint: local-services-multisite
spec:
  trigger:
    events:
      - signal: local.new_location_detected
      - signal: local.review_velocity_drop
        where: "payload.pct_change_30d <= -0.35 and payload.review_count_baseline >= 20"
      - signal: local.ads_activity_started
    combine: any_within
    window: 21d
    dedupe: {key: account_id, cooldown: 120d}

  audience:
    sql: |
      select a.id as account_id
      from account a
      where a.industry_code in ('healthcare_clinics','auto_services','fitness')
        and jsonb_path_exists(a.attributes, '$.location_count ? (@ >= 2 && @ <= 40)')
        and a.country = 'ES'
        and a.attributes ? 'territory_id'
        and not exists (
              select 1 from suppression s
               where s.scope = 'account' and s.value = a.id::text)
  enrich:
    account:
      # Decision 33: only fields the price list carries. owner_contact,
      # location_list, google_rating and website_tech have no price, and a
      # runtime that buys what it cannot bill pays for its customers.
      require: [firmographics]
      max_cost_per_account: 0.25
    person:
      buying_roles: [economic]
      require: [phone, email]
      accuracy_sla: 0.90
      max_contacts_per_account: 2

  score:
    formula: |
      0.35 * signal_strength
      + 0.25 * location_count_normalized
      + 0.25 * territory_capacity_available
      + 0.15 * data_completeness
    floor: 50

  route:
    strategy: territory_round_robin       # respects the team's geographic split
    tiers:
      - {key: t1, when: "score >= 70", capacity_per_week_per_rep: 15}
      - {key: t2, when: "score >= 50", capacity_per_week_per_rep: 60}

  plays:
    t1:
      template: local-highvalue
      auto_send: false
      steps:
        - {step: research_brief, agent: researcher, output: location_dossier}
        - {step: call_task, channel: voice, sla_hours: 8}     # in local services, the phone wins
        - {step: whatsapp_followup, channel: whatsapp, wait: 1d}
        - {step: email_proposal, channel: email, wait: 3d}
    t2:
      template: local-standard
      auto_send: true
      auto_send_requires: {eval_score: 0.85}
      steps:
        - {step: email_1, channel: email, template: local-signal, wait: 0d}
        - {step: call_task, channel: voice, wait: 3d}
        - {step: email_2, channel: email, wait: 7d}

  policy:
    inherit: tenant_default
    overrides:
      quiet_hours: {start: "20:00", end: "09:00", tz: contact_local}
      channels_require_basis: {voice: legitimate_interest, whatsapp: consent}
      # Adds to the blueprint's lists; it must never replace them. Dropping
      # global_suppression here would have made opted-out contacts, current
      # customers and open opportunities reachable again.
      lists_check: [global_suppression, robinson_list_es]

  experiment:
    holdout_pct: 10
    unit: account
    primary_metric: signed_contract_60d
    guardrail_metrics: [complaint_rate, rep_time_per_lead]

  budget: {monthly_credits: 6000, max_cost_per_account: 1.10, on_exceed: pause_and_alert}

  exit:
    - {when: "outcome.type in ('meeting','opp_created')", reason: converted}
    - {when: "outcome.type == 'unsubscribe'", reason: opted_out, suppress: true}
    - {when: "touch.count >= 6", reason: exhausted}
