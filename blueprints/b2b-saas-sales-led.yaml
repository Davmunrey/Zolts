# The entry archetype (decision B4). Everything phase 1 ships is calibrated here.
apiVersion: zolts/v1
kind: Blueprint
metadata:
  key: b2b-saas-sales-led
  name: B2B SaaS, sales-led
  description: >
    Software sold by a team against a named ICP, where budget and timing are
    visible from outside the company before the buyer ever raises a hand.
spec:
  matches:
    sector: [software, services, retail, manufacturing, logistics, education, real_estate]
    motion: [slg, mixed]
    acv_band: ["10-50k", "50-250k"]
    cycle_length: ["1-3m", "3-9m"]
    customer_type: [b2b]
    icp_breadth: [niche, mid]
    geography: ["*"]
    data_maturity: [warehouse, lakehouse, none]
    crm: [hubspot, salesforce, attio, pipedrive]
    sales_team: ["1-5", "5-25", ">25"]
    product_type: [software]
    compliance_tier: [standard]
    channels: [email, linkedin, ads, voice]
  weights:
    sector: 1.5
    motion: 3.0
    customer_type: 3.0
    product_type: 2.5
    acv_band: 2.0
    cycle_length: 1.5
    sales_team: 1.5
    icp_breadth: 1.0
    compliance_tier: 1.0
    crm: 0.5
    data_maturity: 0.5
    geography: 0.5
    channels: 0.5
  signals:
    - funding.round
    - hiring.role_opened
    - people.job_change
    - people.exec_hired
    - tech.install_detected
    - tech.uninstall
    - web.pricing_page_visit
    - corp.m_and_a
  scoring:
    model: pit_r_v3
    weights: {fit: 0.35, intent: 0.30, timing: 0.25, reachability: 0.10}
    floor: 55
  policy:
    max_touches_per_person_per_week: 3
    channels_require_basis:
      email: legitimate_interest
      linkedin: legitimate_interest
    lists_check: [global_suppression]
  programs:
    - series-a-hiring-surge
    - champion-job-change
    - competitor-displacement
    - renewal-window-expansion
  north_star: opportunity_created_90d
  default_holdout_pct: 10
