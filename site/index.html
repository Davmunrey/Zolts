var headEl = document.getElementById("head");

function chrome(view){
  var spec = VIEWS[view] || VIEWS.programs;
  document.querySelector(".centre").style.setProperty("--cols", spec.cols);
  document.querySelector(".bar h1").textContent = spec.title;
  headEl.innerHTML = spec.head.map(function(h){
    var right = h.indexOf("r:") === 0;
    return '<span' + (right ? ' class="r"' : "") + '>'
      + esc(label(h)) + '</span>';
  }).join("");
  document.querySelectorAll(".only-programs").forEach(function(el){
    el.hidden = !spec.filters;
  });
}

/* Every action in this console reloads the page — activate, publish, approve,
   mark done — and every one of them used to drop the operator back on the
   landing screen. Losing your place on every action is the console making you
   navigate rather than work, and it hid D-43's activation note the moment the
   landing screen stopped being Programs. The view survives the reload. */
function rememberView(view){
  try { sessionStorage.setItem("zolts.view", view); } catch (e) {}
}

function rememberedView(){
  try {
    var v = sessionStorage.getItem("zolts.view");
    return (v && VIEWS[v]) ? v : null;
  } catch (e) { return null; }
}

function show(view){
  rememberView(view);
  state.view = view;
  document.querySelectorAll("nav a[data-view]").forEach(function(a){
    if (a.dataset.view === view) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  render();
}

/* ── small builders ───────────────────────────────────────────────────── */

function cell(text, cls){
  var v = text === null || text === undefined || text === "" ? "—" : String(text);
  return '<span class="cell ' + (cls || "") + '" title="' + esc(v) + '">' + esc(v) + '</span>';
}
function dot(kind){ return '<span class="st ' + (kind || "") + '"></span>'; }
// Each cell carries its column's name. On a phone the eight-column grid
// becomes eight stacked label/value pairs, because a table that clips four of
// its columns off the right edge is a table nobody can read — and it clipped
// them without even offering a horizontal scroll.
//
// Its own function, not a step inside `rowOf`, because the review queue builds
// its rows by hand to carry a click target and skipped the labelling entirely:
// on a phone it printed "email · 0.81 · needs_human" with nothing saying which
// was which.
/* "r:" means the column is right-aligned; "w:" means it carries prose. */
function label(h){ return String(h || "").replace(/^[rw]:/, ""); }

function labelled(cells, own){
  /* A section may carry its own head — the Signals list holds a funnel, the
     detected signals and the watch list, and they do not share columns. A
     row labelled from the view's head under a section that named different
     columns would read "Strength: 12 checks" on a phone. */
  var head = own || (VIEWS[state.view] || {}).head || [];
  return cells.map(function(c, i){
    var name = label(head[i]);
    if (!name) return c;
    var prose = String(head[i]).indexOf("w:") === 0;
    return c.replace('<span class="cell',
                     '<span data-l="' + esc(name) + '" class="cell'
                     + (prose ? " w" : ""));
  }).join("");
}

function rowOf(cells, cls, own){
  return '<div class="row' + (cls ? " " + cls : "") + '" role="row">'
       + labelled(cells, own) + '</div>';
}
/* A stat tile: label, value, an optional unit and an optional ratio against a
   limit. `tone` is a status, so it is never the only carrier — the label and
   the unit say the same thing in words. */
function kpis(tiles){
  document.getElementById("kpis").innerHTML = (tiles || []).map(function(tile){
    var meter = "";
    if (tile.share !== undefined && tile.share !== null){
      var pct = Math.max(0, Math.min(1, tile.share)) * 100;
      meter = '<div class="meter ' + (tile.tone || "") + '">'
            + '<i style="width:' + pct.toFixed(1) + '%"></i></div>';
    }
    return '<div class="kpi"><div class="k">' + esc(tile.label) + '</div>'
      + '<div class="v ' + (tile.tone || "") + '">' + esc(String(tile.value)) + '</div>'
      + (tile.unit ? '<div class="u">' + esc(tile.unit) + '</div>' : "")
      + meter + '</div>';
  }).join("");
}

function sect(title, note, own){
  /* With `own`, the section is followed by its own column head, rendered
     the way `chrome` renders the view's: the prefix is stripped by the one
     function that knows it, and a right-aligned column stays right-aligned. */
  var head = own ? '<div class="head" role="row">' + own.map(function(h){
    return '<span' + (h.indexOf("r:") === 0 ? ' class="r"' : "") + '>'
      + esc(label(h)) + '</span>';
  }).join("") + '</div>' : "";
  return '<div class="sect">' + esc(title)
    + (note ? '<b>' + esc(note) + '</b>' : "") + '</div>' + head;
}
function empty(text){
  return '<p class="empty">' + esc(text) + '</p>';
}
function block(label, pairs){
  var body = pairs.map(function(kv){
    return '<dt>' + esc(kv[0]) + '</dt><dd' + (kv[2] ? ' class="' + kv[2] + '"' : "")
      + '>' + esc(kv[1]) + '</dd>';
  }).join("");
  return '<div class="block"><div class="blabel">' + esc(label) + '</div>'
       + '<dl class="props">' + body + '</dl></div>';
}
function note(label, lines){
  return '<div class="block"><div class="blabel">' + esc(label) + '</div>'
    + lines.map(function(l){
        return '<p class="pnote"><b>' + esc(l[0]) + '</b> ' + esc(l[1]) + '</p>';
      }).join("") + '</div>';
}
function foot(bits){
  document.getElementById("foot").innerHTML = bits.map(function(b){
    return '<span><b>' + esc(b[0]) + '</b> ' + esc(b[1]) + '</span>';
  }).join("");
}

/* ── sending fleet ─────────────────────────────────────────────────────
   These errors do not surface as a failing test. A miscalculated capacity or
   a threshold checked one comparison too late shows up weeks later as a
   burned domain, which is why the state has to be visible before then. */
function renderSending(){
  var F = D.fleet || {managed: false, domains: [], note: "No fleet data."};
  document.getElementById("shown").textContent = (F.domains || []).length;

  if (!F.managed){
    list.innerHTML = empty(F.note || "Sending capacity is not managed here.");
    detail.innerHTML = block("Sending", [["Managed here", "no"]]);
    foot([]);
    return;
  }

  function health(h){ return h === "paused" ? "deny" : h === "alarm" ? "warn" : "live"; }

  /* Every domain, paused or sending, in one addressable list. Both are things
     an operator acts on, and a row that cannot be selected is a row whose
     action does not exist. */
  var stopped = (F.pausedDomains || []).map(function(d){
    return {name: d.name, paused: true, reason: d.pausedReason,
            resumption: d.resumption, rule: d.rule, rationale: d.rationale};
  });
  var sending = (F.domains || []).map(function(d){
    return {name: d.name, paused: false, health: d.health, rule: d.rule,
            rationale: d.rationale, capacity: d.capacity,
            issues: d.authenticationIssues || [], mailboxes: d.mailboxes || []};
  });
  var all = stopped.concat(sending);

  var rows = stopped.map(function(d){
    return drow(d, [dot("deny"), cell(d.name, "k"), cell("0", "n"),
                    cell("paused", "m bad"), cell(d.reason || "paused", "m")]);
  }).join("");

  rows += sending.map(function(d){
    var issues = d.issues.join(", ");
    var head = drow(d, [dot(health(d.health)), cell(d.name, "k"),
                        cell(nf(d.capacity) + "/day", "n"),
                        cell(d.health, "m" + (d.health === "ok" ? "" : " warnt")),
                        cell(issues || d.rule || "", "m")]);
    var boxes = d.mailboxes.map(function(m){
      return rowOf([dot(health(m.health)), cell(m.address, "k"),
                    cell(nf(m.remaining) + " left", "n"),
                    cell("day " + nf(m.warmupDay), "m"),
                    cell(m.health === "ok" ? m.provider : m.rule, "m")], "sub");
    }).join("");
    return head + boxes;
  }).join("");

  var boxes = (F.domains || []).reduce(function(a, d){
    return a.concat(d.mailboxes || []); }, []);
  var cap = boxes.reduce(function(a, m){ return a + (m.capacity || m.remaining || 0); }, 0);
  var alarm = boxes.filter(function(m){ return m.health !== "ok"; }).length;
  kpis([
    {label: "Sends left today", value: nf(F.remaining || 0)},
    {label: "Mailboxes", value: nf(boxes.length),
     unit: alarm ? alarm + " not ok" : "all ok", tone: alarm ? "warn" : ""},
    {label: "Domains", value: nf((F.domains || []).length),
     unit: (F.pausedDomains || []).length ? "one paused" : "none paused",
     tone: (F.pausedDomains || []).length ? "bad" : ""},
    {label: "Capacity used today",
     value: (cap ? Math.round((1 - (F.remaining || 0) / cap) * 100) : 0) + "%",
     unit: nf(F.remaining || 0) + " of " + nf(cap) + " sends left",
     share: cap ? 1 - (F.remaining || 0) / cap : 0,
     tone: cap && (F.remaining || 0) / cap < 0.2 ? "warn" : "ok"}
  ]);

  list.innerHTML = rows || empty("No sending domain is registered yet.");
  var chosen = all.filter(function(d){ return d.name === state.dsel; })[0] || all[0];
  state.dsel = chosen ? chosen.name : null;
  renderSendingDetail(chosen, boxes.length, alarm, (F.pausedDomains || []).length);
  list.querySelectorAll(".row[data-d]").forEach(function(el){
    el.addEventListener("click", function(){
      state.dsel = el.dataset.d; renderSending();
    });
  });
  foot([[nf(F.remaining || 0), "sends left today"],
        [nf((F.domains || []).length), "domains"]]);
}

/* A selectable domain row. The mailbox rows under it stay unselectable: the
   switch is per domain, and a row that highlights but does nothing is the dead
   link this console keeps having to remove. */
function drow(d, cells){
  return '<div class="row' + (d.name === state.dsel ? " on" : "") + '" data-d="'
    + esc(d.name) + '" role="row" tabindex="0">' + labelled(cells) + '</div>';
}

function renderSendingDetail(d, mailboxes, alarm, pausedCount){
  var why = note("Why capacity moves", [
    ["Warm-up.", "A new mailbox earns its cap over the ramp."],
    ["Reputation.", "Engagement raises it; complaints halve it."],
    ["Authentication.", "An unverified domain sends nothing at all."]
  ]);
  var fleetBlock = block("The fleet", [
    ["Mailboxes", nf(mailboxes)],
    ["Not ok", nf(alarm), alarm ? "hi" : ""],
    ["Domains paused", nf(pausedCount)]
  ]);
  if (!d){ detail.innerHTML = why + fleetBlock; return; }
  detail.innerHTML = switchBlock(d) + why + fleetBlock;
  wireSendingAction();
}

/* The control that did not exist. `runtime/breakers.py` was the only writer of
   this column in the whole repository, so the only actor that could stop a
   send was a cut-off firing on rates already earned — and `docs/09` calls that
   resource the one whose damage is not recoverable on the timescale that
   matters. An operator who knew before the numbers did could watch. */
function switchBlock(d){
  var head = '<div class="block"><div class="blabel">'
    + esc(d.paused ? "Let " + d.name + " send again" : "Stop " + d.name + " sending")
    + '</div>';
  var says = d.paused ? resumeNote(d)
    : [["Stops immediately.", "Every mailbox on this domain, including the "
        + "healthy ones: reputation is scored per domain, so letting a clean "
        + "mailbox keep sending is how the rest of the fleet follows."]];
  var body = says.map(function(l){
    return '<p class="pnote"><b>' + esc(l[0]) + '</b> ' + esc(l[1]) + '</p>';
  }).join("");
  if (!LIVE){
    return head + body + '<p class="pnote"><b>Static preview.</b> '
      + 'The switch works on the served console.</p></div>';
  }
  return head + body
    + '<div class="actf">'
    + '<label for="sc-reason">Reason, in your own words</label>'
    + '<input id="sc-reason" type="text" maxlength="500" autocomplete="off"'
    + ' placeholder="' + esc(d.paused ? "what changed" : "what you saw") + '">'
    + '<button class="btn ' + (d.paused ? "btn-s" : "btn-p") + '" id="sc-act"'
    + ' data-domain="' + esc(d.name) + '" data-act="'
    + (d.paused ? "resume" : "pause") + '">'
    + (d.paused ? "Let it send" : "Stop sending") + '</button>'
    + '<p class="pnote" id="sc-msg" hidden></p>'
    + '</div></div>';
}

/* What lifting this pause would be, said before the click rather than after.
   The verdict comes from the same two functions the act itself uses, so the
   sentence here and the one written into the audit row cannot disagree. */
function resumeNote(d){
  var lines = [["Paused because.", d.reason || "reason not recorded"]];
  if (d.resumption === "will_retrip"){
    lines.push(["Still over the cut-off.", "The rates say " + (d.rationale || d.rule)
      + ". Lifting it holds until the next reputation event, and then the "
      + "breaker takes it back."]);
  } else if (d.resumption === "override"){
    lines.push(["Not healthy yet.", "The rates say " + (d.rationale || d.rule)
      + ". It will not trip again on its own, and capacity stays halved while "
      + "this is true."]);
  } else if (d.resumption === "clean"){
    lines.push(["The rates agree.", "Nothing measured objects to this domain "
      + "sending again."]);
  }
  return lines;
}

var SC_REFUSAL = {
  no_reason: "Write why. The row this leaves behind is what somebody reads back during the next incident.",
  reason_too_short: "Too short to be a reason.",
  reason_says_nothing: "That restates the action instead of explaining it.",
  not_registered: "No sending domain by that name.",
  already_paused: "Already paused.",
  already_sending: "That domain is not paused."
};

function wireSendingAction(){
  var b = document.getElementById("sc-act");
  var field = document.getElementById("sc-reason");
  var msg = document.getElementById("sc-msg");
  if (!b || !field || !LIVE) return;
  b.addEventListener("click", function(){
    var label = b.textContent;
    msg.hidden = true;
    b.disabled = true;
    b.textContent = b.dataset.act === "pause" ? "Stopping…" : "Resuming…";
    act("/v1/sending/domains/" + encodeURIComponent(b.dataset.domain) + "/"
        + b.dataset.act, "POST", {reason: field.value}).then(function(res){
      if (res.ok){ window.location.reload(); return; }
      b.disabled = false;
      b.textContent = label;
      /* Named, never swallowed. The refusal an operator most needs to read is
         the one about their reason, and a generic failure would send them
         looking for a bug in the button. */
      return res.json().then(function(body){
        var key = body && body.detail && body.detail.refused;
        msg.textContent = SC_REFUSAL[key]
          || (res.status === 403 ? "Not permitted." : "Failed (" + res.status + ").");
        msg.hidden = false;
      }).catch(function(){
        msg.textContent = "Failed (" + res.status + ").";
        msg.hidden = false;
      });
    }).catch(function(){
      b.disabled = false;
      b.textContent = label;
      msg.textContent = "Failed (network).";
      msg.hidden = false;
    });
  });
}

/* ── prospects ─────────────────────────────────────────────────────────
   The list an operator lives in, and the one that did not exist: both
   /v1/accounts and /v1/people were POST-only, so a tenant could create a
   prospect and never read one back. "Missing" is computed by the same rule
   the enrichment path uses to decide whether to spend money — a screen with
   its own idea of what is missing offers to buy fields the engine declines. */
function renderProspects(){
  var P2 = D.prospects || {accounts: [], people: [], missingCounts: {}};
  var people = P2.people || [], accounts = P2.accounts || [];
  var m = P2.missingCounts || {}, R2 = P2.research || {}, price = P2.prices || {};
  document.getElementById("shown").textContent = people.length + accounts.length;

  if (!people.length && !accounts.length){
    list.innerHTML = empty("No accounts or contacts yet. They arrive from a CRM sync, "
      + "or from POST /v1/accounts.");
    detail.innerHTML = block("Prospects", [["Accounts", "0"], ["Contacts", "0"]]);
    foot([]);
    return;
  }

  /* Only a contact with something buyable can be selected. A row that
     highlights and then buys nothing is a control that lies about what it
     will spend. */
  var buyable = {};
  people.forEach(function(c){ if (c.missing.length) buyable[c.id] = c; });
  state.psel = (state.psel || []).filter(function(id){ return buyable[id]; });

  var rows = sect("Contacts", nf(people.length)) + people.map(function(c){
    var state2 = c.optedOut ? "opted out" : (c.missing.length ? "needs " + c.missing.join(", ")
                                                              : "complete");
    var open = !!buyable[c.id];
    var on = state.psel.indexOf(c.id) >= 0 || state.csel === c.id;
    return '<div class="row' + (on ? " on" : "") + '"'
      + ' data-c="' + esc(c.id) + '"' + (open ? ' data-p="' + esc(c.id) + '"' : "")
      + ' tabindex="0" role="row">'
      + labelled([dot(c.optedOut ? "deny" : c.missing.length ? "warn" : "live"),
                  cell(c.name || "(no name)", "k"), cell(c.email, "m"),
                  cell(c.phone, "m"),
                  cell(state2, "m" + (c.optedOut ? " bad" : c.missing.length ? " warnt" : ""))])
      + '</div>';
  }).join("");

  rows += sect("Accounts", nf(accounts.length)) + accounts.map(function(a){
    var state2 = a.dossier ? "dossier " + a.dossier : "no dossier";
    return rowOf([dot(a.missing.length ? "warn" : "live"), cell(a.name, "k"),
                  cell(a.domain, "m"), cell(nf(a.contacts) + (a.contacts === 1 ? " contact" : " contacts"), "m"),
                  cell(state2, "m" + (a.dossier ? "" : " warnt"))], "sub");
  }).join("");

  var missing = (m.email || 0) + (m.phone || 0) + (m.firmographics || 0);
  var covered = R2.accounts ? (R2.withDossier || 0) / R2.accounts : 0;
  kpis([
    {label: "Accounts", value: nf(accounts.length)},
    {label: "Contacts", value: nf(people.length),
     unit: people.filter(function(c){ return c.optedOut; }).length + " opted out"},
    {label: "Fields missing", value: nf(missing), unit: "buyable",
     tone: missing ? "warn" : ""},
    {label: "Accounts researched", value: Math.round(covered * 100) + "%",
     unit: nf(R2.withDossier || 0) + " of " + nf(R2.accounts || 0)
           + (R2.stale ? ", " + nf(R2.stale) + " stale" : ""),
     share: covered, tone: R2.stale ? "warn" : "ok"}
  ]);

  list.innerHTML = rows;
  detail.innerHTML = timelineBlock(people) + buyBlock(buyable, price) + block("Missing fields", [
    ["Need an email", nf(m.email || 0), m.email ? "hi" : ""],
    ["Need a phone", nf(m.phone || 0), m.phone ? "hi" : ""],
    ["Need firmographics", nf(m.firmographics || 0), m.firmographics ? "hi" : ""]
  ]) + block("Research", [
    ["Accounts researched", nf(R2.withDossier || 0) + " of " + nf(R2.accounts || 0)],
    ["Stale", nf(R2.stale || 0), R2.stale ? "hi" : ""],
    /* Read off the price list rather than printed here. The literal that used
       to sit in this line was wrong the day the list changed, and nothing
       would have failed. */
    ["Cost per dossier", nf(price.dossier || 0) + " credits"]
  ]);
  list.querySelectorAll(".row[data-c]").forEach(function(el){
    el.addEventListener("click", function(){
      /* One gesture, two meanings that do not conflict: the row becomes the
         contact whose story the panel shows, and if it has something
         buyable it also toggles in the purchase selection. */
      if (el.dataset.p){
        var at = state.psel.indexOf(el.dataset.p);
        if (at >= 0) state.psel.splice(at, 1); else state.psel.push(el.dataset.p);
      }
      state.csel = el.dataset.c;
      state.tl = null;
      renderProspects();
      loadTimeline(el.dataset.c);
    });
  });
  wireProspectActions();
  foot([[nf(accounts.length), "accounts"], [nf(people.length), "contacts"],
        [nf(missing), "fields missing"]]);
}

/* ── why this person ───────────────────────────────────────────────────
   Six tables held a contact's story — signal, enrolment, policy decision,
   proposal, touch, outcome — each on its own screen, and no screen read one
   contact across all six. A DPO answering a subject access request and a
   CRO asking why an email went are asking the same question. This is the
   one answer, read on demand from GET /v1/people/{id}/timeline. */
function loadTimeline(id){
  if (!LIVE){ return; }
  read("/v1/people/" + encodeURIComponent(id) + "/timeline").then(function(res){
    if (!res.ok){ state.tl = {error: "Failed (" + res.status + ")."}; renderProspects(); return; }
    return res.json().then(function(body){
      if (state.csel !== id) return;   /* the operator moved on */
      state.tl = body; renderProspects();
    });
  }).catch(function(){ state.tl = {error: "Failed (network)."}; renderProspects(); });
}

function timelineBlock(people){
  if (!state.csel) return "";
  var c = people.filter(function(x){ return x.id === state.csel; })[0];
  if (!c) return "";
  var head = '<div class="dhead"><span class="k">' + esc(c.account || "no account")
    + '</span><h2>' + esc(c.name || "(no name)") + '</h2></div>';
  if (!LIVE){
    return head + '<div class="block"><p class="pnote"><b>Static preview.</b> '
      + 'The timeline reads live rows on the served console.</p></div>';
  }
  var t = state.tl;
  if (!t) return head + '<div class="block"><p class="pnote" id="tl-loading">Reading everything that touched them…</p></div>';
  if (t.error) return head + '<div class="block"><p class="pnote" id="tl-error"><b>' + esc(t.error) + '</b></p></div>';
  var ev = t.events || [];
  if (!ev.length){
    return head + '<div class="block" id="tl"><p class="pnote">'
      + 'Nothing has touched this person yet: no signal, no programme, no send. '
      + 'The first row will be a signal.</p></div>';
  }
  return head + '<div class="block" id="tl"><div class="blabel">'
    + esc(nf(ev.length) + (ev.length === 1 ? " event" : " events") + ", newest first")
    + '</div>' + ev.map(timelineRow).join("") + '</div>';
}

/* Minutes and dates stay short because the detail column does not wrap
   (D-38); the sentence that says what a row proves is on the row itself. */
function timelineRow(e){
  var when = (e.at || "").slice(0, 16).replace("T", " ");
  var tone = e.kind === "decision.deny" || e.kind === "touch.failed" ? "bad"
           : e.kind === "decision.allow" || e.kind === "touch.sent" ? "live"
           : e.kind === "outcome.recorded" ? "warnt" : "";
  var html = '<div class="ev tlrow" data-kind="' + esc(e.kind) + '">'
    + '<span class="mono tlt">' + esc(when) + '</span> '
    + '<span class="tlk ' + tone + '">' + esc(kindLabel(e.kind)) + '</span> '
    + '<b>' + esc(e.title || "") + '</b> '
    + '<span class="tld">' + esc(e.detail || "") + '</span>';
  if (e.rule){
    html += '<div class="why">Rule <span class="mono">' + esc(e.rule) + '</span>'
      + (e.jurisdiction ? " in " + esc(e.jurisdiction) : "")
      + (e.packDigest ? ', pack <span class="mono">' + esc(String(e.packDigest).slice(0, 12)) + '</span>'
                         + (e.packVersion ? " v" + esc(e.packVersion) : "") : ", pack not recorded")
      + '</div>';
  }
  if (e.kind === "proposal.drafted"){
    var ev = (e.evidence || []);
    html += '<div class="why">' + (ev.length ? nf(ev.length) + (ev.length === 1 ? " piece" : " pieces")
      + " of evidence" : "no evidence attached")
      + (e.evalScore != null ? ", eval " + e.evalScore.toFixed(2) : "")
      + (e.model ? ", " + esc(e.model) : "") + '</div>';
    (e.droppedClaims || []).forEach(function(claim){
      html += '<div class="why tldrop"><s>' + esc(claim) + '</s> removed: nothing in the evidence supported it</div>';
    });
  }
  if (e.kind === "touch.sent" && e.costEur){
    html += '<div class="why">€' + e.costEur.toFixed(4) + ' in cost</div>';
  }
  return html + '</div>';
}

/* The label comes with the kind from the runtime's own table of kinds; the
   surface only knows the ones it was told about, and says so for the rest. */
var KIND_LABEL = {
  "signal.observed": "Signal", "enrollment.entered": "Enrolled",
  "enrollment.exited": "Left", "decision.allow": "Allowed",
  "decision.deny": "Refused", "proposal.drafted": "Drafted",
  "touch.sent": "Sent", "touch.queued": "Waiting", "touch.failed": "Not sent",
  "outcome.recorded": "Outcome", "audit.entry": "Recorded"
};
function kindLabel(k){ return KIND_LABEL[k] || k; }

/* `POST /v1/enrich` has existed since enrichment was executable, and its own
   docstring says "the console sends the rows the operator selected". The
   console sent nothing: the screen computed what was missing, using the same
   rule the engine uses to decide whether to spend money, and offered no way to
   buy any of it. */
function buyBlock(buyable, price){
  var chosen = state.psel.map(function(id){ return buyable[id]; });
  if (!chosen.length){
    return note("Buying a missing field", [
      ["Select the contacts.", "Named rows, never everything unresolved: this "
       + "spends a data budget, and a purchase whose size depends on how much "
       + "happened to be missing is one nobody can predict the bill for."],
      ["The price is per field.", "An email is " + nf(price.email || 0)
       + " credits and a phone number is " + nf(price.phone || 0) + "."]
    ]);
  }
  var buttons = ["email", "phone"].map(function(field){
    var n = chosen.filter(function(c){ return c.missing.indexOf(field) >= 0; }).length;
    if (!n) return "";
    var cost = n * (price[field] || 0);
    return '<button class="btn btn-p" id="buy-' + field + '" data-field="' + field
      + '" data-n="' + n + '">Buy ' + nf(n) + " " + field + (n === 1 ? "" : "s")
      + " · " + nf(cost) + ' credits</button>';
  }).join("");

  return '<div class="block"><div class="blabel">'
    + esc(nf(chosen.length) + (chosen.length === 1 ? " contact" : " contacts")
          + " selected") + '</div>'
    + '<p class="pnote"><b>A miss is paid for and not billed.</b> The provider '
    + 'charges for a lookup that finds nothing; the tenant is charged only for '
    + 'a value that arrives.</p>'
    + basisChoice()
    + (LIVE ? '<div class="actf">' + buttons
              + '<p class="pnote" id="buy-msg" hidden></p></div>'
            : '<p class="pnote"><b>Static preview.</b> Buying works on the '
              + 'served console.</p>')
    + '</div>';
}

/* Recorded against every value bought and not reconstructable later, so it is
   chosen rather than defaulted: a recorded field the screen fills in silently
   records the screen's default, not a decision. Nothing is preselected and the
   buttons do not work until one is.

   `docs/11` marks the legitimate interest assessment Not built (COMP-5) — the
   basis may be declared and no assessment is captured, stored or versioned.
   That is said here rather than in a footnote, because this is where somebody
   is about to assert it. */
function basisChoice(){
  var options = [
    ["consent", "The contact agreed, and the provenance is on the record."],
    ["contract", "Processing is necessary for a contract with them."],
    ["legitimate_interest", "No assessment is stored for this basis yet "
     + "(docs/11, COMP-5). Asserting it here does not create one."]
  ];
  /* The segmented control the console already uses to pick one of several,
     rather than a new pressed state: `[aria-pressed]` is styled for `.seg
     button` and `.chipbtn` only, so a plain button carrying it would show the
     operator nothing and this choice would look like it had not been made. */
  var chosen = options.filter(function(o){ return o[0] === state.basis; })[0];
  return '<div class="actf"><label>Legal basis for this purchase</label>'
    + '<span class="seg" id="basis">'
    + options.map(function(o){
        return '<button data-basis="' + o[0] + '" aria-pressed="'
          + (state.basis === o[0] ? "true" : "false") + '">'
          + esc(o[0].replace("_", " ")) + '</button>';
      }).join("")
    + '</span>'
    + '<p class="why">' + esc(chosen ? chosen[1]
        : "Nothing is chosen. It is recorded against every value bought and "
          + "cannot be reconstructed later, so the screen does not pick one "
          + "for you.") + '</p></div>';
}

var BUY_REFUSAL = {
  403: "Not permitted.",
  422: "The runtime refused those rows."
};

function wireProspectActions(){
  var basis = document.getElementById("basis");
  if (basis) basis.addEventListener("click", function(e){
    var b = e.target.closest("button[data-basis]");
    if (!b) return;
    state.basis = b.dataset.basis;
    renderProspects();
  });

  var msg = document.getElementById("buy-msg");
  if (!msg || !LIVE) return;
  ["email", "phone"].forEach(function(field){
    var b = document.getElementById("buy-" + field);
    if (!b) return;
    b.addEventListener("click", function(){
      if (!state.basis){
        msg.textContent = "Choose a legal basis first. It is recorded against "
          + "every value bought and cannot be reconstructed later.";
        msg.hidden = false;
        return;
      }
      var label = b.textContent;
      msg.hidden = true;
      b.disabled = true;
      b.textContent = "Buying…";
      act("/v1/enrich", "POST", {field: field, ids: state.psel,
                                 legal_basis: state.basis}).then(function(res){
        if (res.ok){ state.psel = []; window.location.reload(); return; }
        b.disabled = false;
        b.textContent = label;
        msg.textContent = BUY_REFUSAL[res.status] || ("Failed (" + res.status + ").");
        msg.hidden = false;
      }).catch(function(){
        b.disabled = false;
        b.textContent = label;
        msg.textContent = "Failed (network).";
        msg.hidden = false;
      });
    });
  });
}

/* The tier's own target beside the tier's own number. Per tier and never per
   programme (decision 57): a programme may consume several tiers, and a Tier C
   signal is a daily batch by design, so one verdict for the programme would
   fail a system doing exactly what its catalogue says. The stage this runtime
   cannot measure is named rather than dropped — a missing probe that looks
   like an absent obligation is how an unmeasured SLA reads as a met one. */
function slaBlock(tiers){
  if (!tiers.length) return "";
  var says = {meets: "meets", misses: "misses", no_data: "no observations yet",
              no_target: "no p95 published", not_measured: "not measured",
              unknown_tier: "unknown tier"};
  var stages = ["available", "proposed", "executed"];
  var rows = [], unmeasured = [];
  tiers.forEach(function(t){
    stages.forEach(function(key){
      var st = (t.stages || {})[key];
      if (!st) return;
      if (st.verdict === "not_measured"){
        unmeasured.push("Tier " + t.tier + " " + key);
        return;
      }
      var value = (st.verdict === "meets" || st.verdict === "misses")
        ? nf(st.p95Minutes) + "/" + nf(st.targetMinutes) + " min, " + says[st.verdict]
        : (says[st.verdict] || st.verdict);
      rows.push(["Tier " + t.tier + " " + key, value,
                 st.verdict === "misses" ? "warnt" : ""]);
    });
  });
  return block("Time-to-touch SLA (docs/06)", rows)
    + (unmeasured.length ? note("Not measured", [[unmeasured.join(", ") + ".",
        "This runtime has no probe for that stage, so no verdict is given."]])
      : "");
}

/* ── signals ───────────────────────────────────────────────────────────
   docs/06 calls signal-to-action latency the highest-leverage variable in
   the system, so the split between how long the source took and how long we
   took is the headline rather than a detail: they need opposite fixes. */
function renderSignals(){
  var S = D.signalsView || {recent: [], watched: [], latency: {}};
  var recent = S.recent || [], watched = S.watched || [], L = S.latency || {};
  var F = S.funnel || {}, earning = F.rows || [], stages = F.stages || [];
  document.getElementById("shown").textContent = recent.length;

  /* docs/06 publishes a p95 per tier and calls it the contractual SLA of two
     plans. The console printed the measurement beside no target at all, which
     is an SLA an operator can miss for a quarter without being told (D-97).
     Shown before anything has fired too: a commitment exists from the day the
     plan is signed, and a target that appears only once it is being missed is
     a target nobody planned against. Values are kept short because this column
     does not wrap (D-38). */
  var sla = slaBlock(S.sla || []);

  /* Which signals earn their keep (docs/28, OX-3). Every catalogue signal
     has a row, the silent ones included: a signal that fired zero times is
     the one the operator is paying for and getting nothing from, and a list
     of only the active ones would hide exactly the rows the question is
     about. Sorted by what each produced, so the first row is the best
     earner, and the panel opens on it. */
  var chosen = earning.filter(function(r){ return r.key === state.fsel; })[0] || earning[0];
  state.fsel = chosen ? chosen.key : null;
  var rows = earning.length ? sect("Earning their keep", nf(earning.length) + " in the catalogue")
    + earning.map(function(r){
      var tone = r.converted ? "live" : (r.fired ? "" : "draft");
      var tier = r.catalogued ? (r.tier ? "Tier " + r.tier : "no tier") : "not in the catalogue";
      return '<div class="row' + (r.key === state.fsel ? " on" : "") + '" role="row"'
        + ' data-f="' + esc(r.key) + '">'
        + labelled([dot(tone), cell(r.key, "k"), cell(tier, "m"), cell(nf(r.fired), "n"),
                    cell(nf(r.enrolled), "n"),
                    cell(nf(r.converted), "n" + (r.converted ? " good" : ""))])
        + '</div>';
    }).join("") : "";

  var wire = function(){
    list.querySelectorAll(".row[data-f]").forEach(function(el){
      el.addEventListener("click", function(){
        state.fsel = el.dataset.f; renderSignals();
      });
    });
  };

  if (!recent.length && !watched.length){
    list.innerHTML = rows + empty("Nothing detected yet. A live program's trigger is what "
      + "puts a signal on the watch list.");
    detail.innerHTML = funnelBlock(chosen, stages)
      + block("Time to touch", [["Touches from a signal", "0"]]) + sla;
    foot([[nf(earning.length), "signals in the catalogue"], ["0", "detected"]]);
    wire();
    return;
  }

  rows += sect("Detected", nf(recent.length), DETECTED_HEAD) + recent.map(function(s){
    var slow = s.detectionMinutes > 60;
    return rowOf([dot("live"), cell(s.type, "k"), cell(s.subject, "m"),
                  cell(s.strength.toFixed(2), "n"),
                  cell(nf(s.detectionMinutes) + " m", "n" + (slow ? " warnt" : "")),
                  cell(String(s.observedAt).slice(0, 10), "m")], "", DETECTED_HEAD);
  }).join("");

  rows += sect("Watched", nf(watched.length), WATCHED_HEAD)
    + watched.map(function(w){
    return rowOf([dot(w.staleRefused ? "warn" : ""), cell(w.signal, "k"),
                  cell(nf(w.checks) + " checks", "m"), cell(nf(w.detected), "n"),
                  cell(nf(w.staleRefused) + " stale", "n" + (w.staleRefused ? " warnt" : "")),
                  cell(String(w.lastChecked).slice(0, 10), "m")], "sub", WATCHED_HEAD);
  }).join("");

  var stale = watched.reduce(function(a, w){ return a + w.staleRefused; }, 0);
  var slow = L.detectionP95Minutes || 0, ours = L.executionP95Minutes || 0;
  kpis([
    {label: "Detected", value: nf(recent.length)},
    {label: "Signals watched", value: nf(watched.length),
     unit: stale ? stale + " stale refused" : "none stale",
     tone: stale ? "warn" : ""},
    {label: "The source noticing", value: nf(slow), unit: "min, p95",
     tone: slow > ours ? "warn" : "live"},
    {label: "This runtime acting", value: nf(ours), unit: "min, p95", tone: "live"}
  ]);

  list.innerHTML = rows;
  var mins = function(v){ return v === null || v === undefined ? "—" : nf(v) + " min"; };
  detail.innerHTML = funnelBlock(chosen, stages) + block("Time to touch, p95", [
    ["The source noticing", mins(L.detectionP95Minutes)],
    ["This runtime acting", mins(L.executionP95Minutes)],
    ["Signal to touch", mins(L.totalP95Minutes), "hi"],
    ["Measured over", nf(L.touches || 0) + " touches"]
  ]) + sla + note("Why it is split", [
    ["A slow source.", "Change the source — the wait is before us."],
    ["A slow runtime.", "Add workers — the wait is ours."]
  ]);
  wire();
  foot([[nf(recent.length), "detected"], [nf(watched.length), "signals watched"],
        [mins(L.totalP95Minutes), "signal to touch, p95"]]);
}

/* The detected and watched sections keep the columns they had; the view's
   own head now belongs to the funnel, which leads. */
var DETECTED_HEAD = ["", "Signal", "Subject", "r:Strength", "r:Detected in", "Observed"];
var WATCHED_HEAD = ["", "Signal", "Checks", "r:Detected", "r:Stale refused", "Last checked"];

/* One signal's funnel, rendered from the stages the runtime ships with it:
   the label and the sentence that says what the number counts come from
   `zolts.signalfunnel`, so a stage added there is a stage rendered here and
   there is no second list of names to fall behind. The window is named
   beside the conversion count because a count with no window is the number
   two people read differently in the same meeting. */
function funnelBlock(r, stages){
  if (!r) return "";
  var windows = (r.windows || []).length
    ? " inside " + r.windows.join(" or ") + " days" : "";
  var by = {
    fired: nf(r.fired),
    listened: nf(r.listened) + (r.listened === 1 ? " live programme" : " live programmes"),
    enrolled: nf(r.enrolled), heldOut: nf(r.heldOut), reached: nf(r.reached),
    converted: nf(r.converted) + (r.converted ? windows : "")
  };
  var pairs = stages.map(function(st){
    return [st.label, by[st.key] === undefined ? "—" : by[st.key],
            st.key === "converted" ? "hi" : ""];
  });
  var title = r.name + (r.catalogued ? (r.tier ? " · tier " + r.tier : "")
                                     : " · not in the catalogue");
  return block(title, pairs) + note("Descriptive, not attributed", [
    ["The holdout converts too,", "and it is counted. Whether the programme caused a "
     + "conversion is the incrementality report's question, asked per programme."],
    ["Inside the window only.", "A conversion counts within the days the programme's "
     + "metric declares, from enrolment, and nowhere else."]
  ]);
}

/* The margin number of the agent layer. docs/08 targets under two cents of
   tokens per contact reached, and nothing computed it: a product reaching a
   contact for two cents and one reaching them for twenty looked identical on
   every screen this console had (AGENT-4). Values stay short — this column
   does not wrap (D-38). */
function costPerContactBlock(c){
  if (!c) return "";
  var says = {meets: "under target", misses: "over target",
              no_data: "nobody reached yet"};
  var value = c.eurPerContact === null || c.eurPerContact === undefined
    ? says[c.verdict] || c.verdict
    : "€" + c.eurPerContact.toFixed(4) + ", " + (says[c.verdict] || c.verdict);
  var rows = [
    ["Tokens per contact", value, c.verdict === "misses" ? "warnt" : ""],
    ["Target", "under €" + c.targetEurPerContact.toFixed(2)],
    ["Contacts reached", nf(c.contactsTouched)],
    ["Token spend", "€" + c.tokenSpendEur.toFixed(4)]
  ];
  /* A denominator missing rows reads high, and the reader is owed the reason
     rather than left to wonder why the number moved. */
  if (c.touchesNamingNobody)
    rows.push(["Touches naming nobody", nf(c.touchesNamingNobody), "warnt"]);
  return block("Cost per contact (docs/08)", rows);
}

/* ── today ─────────────────────────────────────────────────────────────
   The console had nine screens and they were the same screen nine times: stat
   tiles, a table, a detail panel, each answering what is the state of X. None
   answered the question an operator arrives with — what do I do now — so
   answering it meant opening nine screens and joining them in your head.

   Every judgement here was already being made and rendered somewhere else.
   This collects them, ranks them by what ignoring each one costs, and sends
   the click to the screen where the action lives. Built from the same numbers
   those screens render, so the summary cannot disagree with them. */
function renderToday(){
  var A = D.attention || {items: [], counts: {}, unattended: {}};
  var items = A.items || [], counts = A.counts || {}, idle = A.unattended || {};
  document.getElementById("shown").textContent = items.length;

  kpis([
    {label: "Needs you now", value: nf(counts.now || 0),
     unit: counts.now ? "irreversible or already broken" : "nothing urgent",
     tone: counts.now ? "bad" : ""},
    {label: "Today", value: nf(counts.today || 0),
     unit: "a clock is running", tone: counts.today ? "warn" : ""},
    {label: "Soon", value: nf(counts.soon || 0), unit: "costs if left a week"},
    {label: "Running unattended", value: nf(idle.live || 0),
     unit: nf(idle.queued || 0) + " queued · " + nf(idle.watching || 0) + " watched"}
  ]);

  if (!items.length){
    /* An empty state that says nothing is indistinguishable from a screen
       that failed to load, so it says what the runtime is doing instead. */
    list.innerHTML = empty("Nothing needs a person. " + nf(idle.live || 0)
      + " programme(s) are live, " + nf(idle.queued || 0) + " action(s) are queued "
      + "and " + nf(idle.watching || 0) + " signal(s) are being watched.");
    detail.innerHTML = block("Nothing waiting", [
      ["Live programmes", nf(idle.live || 0)],
      ["Queued actions", nf(idle.queued || 0)],
      ["Signals watched", nf(idle.watching || 0)]
    ]) + note("What this screen is", [
      ["Ranked by cost, not recency.", "A newest-first list is an inbox, and an "
       + "inbox rewards whoever shouted last."],
      ["Every item names its cost.", "A worklist without reasons is a to-do "
       + "list somebody else wrote."]
    ]);
    foot([]);
    return;
  }

  var TONE = {now: "deny", today: "warn", soon: ""};
  list.innerHTML = items.map(function(it, i){
    return '<div class="row' + (i === todayIndex(items) ? " on" : "") + '" data-a="'
      + i + '" role="row" tabindex="0">'
      + labelled([dot(TONE[it.urgency] || ""), cell(it.title, "k"),
                  cell(it.detail, "m"), cell(nf(it.count), "n"),
                  cell(it.urgency, "w m" + (it.urgency === "now" ? " warnt" : ""))])
      + '</div>';
  }).join("");

  renderTodayDetail(items[todayIndex(items)]);
  list.querySelectorAll(".row[data-a]").forEach(function(el){
    el.addEventListener("click", function(){
      state.asel = Number(el.dataset.a); renderToday();
    });
  });
  foot([[nf(counts.now || 0), "now"], [nf(counts.today || 0), "today"],
        [nf(counts.soon || 0), "soon"]]);
}

function todayIndex(items){
  var i = state.asel;
  return (typeof i === "number" && i >= 0 && i < items.length) ? i : 0;
}

function renderTodayDetail(it){
  if (!it) { detail.innerHTML = ""; return; }
  var LABEL = {now: "Now", today: "Today", soon: "Soon"};
  detail.innerHTML = '<div class="dhead">'
    + '<div class="k">' + esc(LABEL[it.urgency] || it.urgency) + '</div>'
    + '<h2>' + esc(it.title) + '</h2>'
    + '<div class="dactions"><button class="btn btn-p" id="goto" data-view="'
    + esc(it.view) + '">Open ' + esc((VIEWS[it.view] || {}).title || it.view)
    + '</button></div></div>'
    + block("What this is", [
        ["How many", nf(it.count)],
        ["Where", (VIEWS[it.view] || {}).title || it.view],
        ["Urgency", LABEL[it.urgency] || it.urgency,
         it.urgency === "now" ? "warnt" : ""]
      ])
    /* The row's own detail, in full. The table cell ellipsises it because a
       column has a width; this panel does not, and truncated text an operator
       cannot expand anywhere is text nobody wrote. */
    + note("What it is", [["This item.", it.detail + "."]])
    /* The cost of ignoring it. This is the sentence that makes the row a
       decision rather than a number, and it is not the detail again: the two
       said the same thing twice until they were separated. */
    + note("What it costs to leave it", [["If nobody acts.", it.cost]]);
  var go = document.getElementById("goto");
  if (go) go.addEventListener("click", function(){ show(go.dataset.view); });
}

/* ── human tasks ───────────────────────────────────────────────────────
   A step on the task or voice channel is real work for a person. The runtime
   created it and, until D-83, nothing could ever close it. GET /v1/tasks has
   answered this since, and no screen asked: a queue an operator cannot see is
   a queue nobody works, and the SLA docs/09 gives the channel is then a
   deadline measured against nothing. */
function renderTasks(){
  var T = D.tasksView || {tasks: [], counts: {}};
  var tasks = T.tasks || [], counts = T.counts || {};
  document.getElementById("shown").textContent = tasks.length;

  var overdue = counts.overdue || 0;
  kpis([
    {label: "Open", value: nf(counts.open || 0)},
    {label: "Past due", value: nf(overdue),
     unit: overdue ? "the SLA the step declared" : "none late",
     tone: overdue ? "warn" : ""},
    {label: "Oldest waiting", value: tasks.length ? dueText(tasks[0]) : "—"},
    {label: "Channel", value: tasks.length ? tasks[0].channel : "—",
     unit: "a person, not a provider"}
  ]);

  if (!tasks.length){
    list.innerHTML = empty("Nothing is waiting for a person. A step on the "
      + "task or voice channel appears here the moment the runtime creates it.");
    detail.innerHTML = block("Human tasks", [["Open", "0"], ["Past due", "0"]]);
    foot([]);
    return;
  }

  /* Selectable rows carry their id the way the review queue's do, so the
     detail panel follows the click rather than always showing the first. */
  list.innerHTML = tasks.map(function(t){
    return '<div class="row' + (t.id === state.tsel ? " on" : "") + '" data-t="'
      + esc(t.id) + '" role="row" tabindex="0">'
      + labelled([dot(t.late ? "warn" : "live"), cell(stepName(t), "k"),
                  cell(t.program || "—", "m"), cell(t.channel, "m"),
                  cell(dueText(t), "n" + (t.late ? " warnt" : "")),
                  cell(t.late ? "past due" : "waiting", "w m")])
      + '</div>';
  }).join("");

  var chosen = tasks.filter(function(t){ return t.id === state.tsel; })[0] || tasks[0];
  state.tsel = chosen.id;
  renderTaskDetail(chosen);
  list.querySelectorAll(".row[data-t]").forEach(function(el){
    el.addEventListener("click", function(){
      state.tsel = el.dataset.t; renderTasks();
    });
  });
  foot([[nf(counts.open || 0), "open"], [nf(overdue), "past due"]]);
}

/* A task the worker wrote always names its step, and the column is nullable.
   One that does not still needs a name: an empty heading is a panel nobody can
   identify, and an empty cell is a row nobody can click on purpose. */
function stepName(t){ return t.step || ("a " + t.channel + " task"); }

/* Minutes, signed: negative is time left, positive is time past. Kept short
   because the detail column does not wrap (D-38). */
function dueText(t){
  if (t.lateMinutes === null || t.lateMinutes === undefined) return "no SLA";
  var m = Math.abs(t.lateMinutes);
  var span = m < 90 ? m + " min" : Math.round(m / 60) + " h";
  return t.late ? span + " late" : "in " + span;
}

function renderTaskDetail(t){
  /* The detail header the other views use: a mono kicker, an h2, then the
     actions. Two classes of my own would have been two rules nobody styled. */
  detail.innerHTML = '<div class="dhead">'
    + '<div class="k">' + esc(t.program || "no programme") + ' · '
    + esc(t.channel) + '</div>'
    + '<h2>' + esc(stepName(t)) + '</h2>'
    + '<div class="dactions">'
    + (LIVE ? '<button class="btn btn-p" id="done" data-id="' + esc(t.id) + '">Mark done</button>'
            : '<button class="btn btn-p" disabled title="Static preview">Mark done</button>')
    + '</div></div>'
    + block("This task", [
        ["Due", dueText(t), t.late ? "warnt" : ""],
        ["Created", String(t.createdAt).slice(0, 10)],
        ["Deadline", t.dueAt ? String(t.dueAt).slice(0, 10) : "none declared"],
        ["Channel", t.channel]
      ])
    + note("Why a person", [
        ["The runtime cannot do it.", "A call or a manual step has no provider "
         + "to report back, so nobody but a person can close it."],
        ["The deadline is frozen.", "Stamped from the step's SLA when the task "
         + "was created, so republishing the programme does not make it punctual."]
      ]);
  wireTaskAction();
}

function wireTaskAction(){
  var b = document.getElementById("done");
  if (!b || !LIVE) return;
  b.addEventListener("click", function(){
    b.disabled = true;
    b.textContent = "Marking…";
    act("/v1/tasks/" + b.dataset.id + "/complete", "POST").then(function(res){
      if (res.ok){ window.location.reload(); return; }
      b.disabled = false;
      b.textContent = res.status === 409 ? "Already done"
        : res.status === 403 ? "Not permitted" : "Failed (" + res.status + ")";
    }).catch(function(){
      b.disabled = false;
      b.textContent = "Failed (network)";
    });
  });
}

/* ── outbox ────────────────────────────────────────────────────────────
   The runbook told the operator, when a dead action's error is a 401 or an
   invalid_grant: re-enter the credential, then requeue. There was no requeue —
   not a command, not a function, not an endpoint — and no screen listed what
   had died. `actions.dead_letter` had no caller at all. So a customer's
   outbound action that failed because a token expired was lost permanently,
   and the product's own runbook pointed at a way out that was not built. */
function renderOutbox(){
  var V = D.outboxView || {count: 0, actions: []};
  var dead = V.actions || [];
  document.getElementById("shown").textContent = dead.length;

  kpis([
    {label: "Gave up", value: nf(V.count || 0),
     unit: V.count ? "waiting on a person" : "nothing dead",
     tone: V.count ? "bad" : "ok"},
    {label: "Queued", value: nf((D.queue && D.queue.queued) || 0),
     unit: "still trying"},
    {label: "Waiting to send", value: nf((D.queue && D.queue.review) || 0),
     unit: "drafts for a person"}
  ]);

  if (!dead.length){
    list.innerHTML = empty("Nothing gave up. Every action either went out or "
      + "is still being retried.");
    detail.innerHTML = note("What lands here", [
      ["Retries are spent.", "An action backs off from 30 seconds to six "
       + "hours, and only then dies."],
      ["A denial never does.", "A policy decision cancels the action and names "
       + "the rule; retrying one is an attempt to contact somebody who asked "
       + "not to be contacted."]
    ]);
    foot([[nf(V.count || 0), "gave up"]]);
    return;
  }

  list.innerHTML = dead.map(function(a){
    return '<div class="row' + (a.id === state.osel ? " on" : "") + '" data-o="'
      + esc(a.id) + '" role="row" tabindex="0">'
      + labelled([dot("deny"), cell(a.kind, "k"), cell(a.channel || "—", "m"),
                  cell(nf(a.attempts) + "/" + nf(a.maxAttempts), "n"),
                  cell(shortError(a.lastError), "m")])
      + '</div>';
  }).join("");

  var chosen = dead.filter(function(a){ return a.id === state.osel; })[0] || dead[0];
  state.osel = chosen.id;
  renderOutboxDetail(chosen);
  list.querySelectorAll(".row[data-o]").forEach(function(el){
    el.addEventListener("click", function(){
      state.osel = el.dataset.o; renderOutbox();
    });
  });
  foot([[nf(V.count || 0), "gave up"]]);
}

/* The detail column does not wrap (D-38), so the row carries the first line and
   the panel carries the whole error. A truncation that hides the cause is a
   list nobody can triage from. */
function shortError(text){
  if (!text) return "no error recorded";
  var first = String(text).split("\n")[0];
  return first.length > 60 ? first.slice(0, 57) + "…" : first;
}

/* What the runbook's own table keys on: the error decides the action. It is
   read here rather than restated, so the guidance cannot drift from docs/25. */
function errorAdvice(text){
  var e = String(text || "").toLowerCase();
  if (/401|403|invalid_grant|unauthor/.test(e)){
    return ["The credential expired.", "Re-enter it, then revive this. Reviving "
      + "before the connection is fixed spends the retries again on the same "
      + "answer."];
  }
  if (/429|rate.?limit/.test(e)){
    return ["The provider is rate-limiting.", "Reviving now earns another 429. "
      + "The capacity scheduler already spaces sends; this one waits."];
  }
  if (/timeout|timed out|connection|network|502|503|504/.test(e)){
    return ["The provider was unreachable.", "The usual case for a revive: "
      + "nothing about the action was wrong."];
  }
  return ["Read the error first.", "It is what the action will meet again. "
    + "A revive re-runs the same request, not a different one."];
}

function renderOutboxDetail(a){
  var advice = errorAdvice(a.lastError);
  var head = '<div class="dhead"><span class="k">' + esc(a.kind) + '</span>'
    + '<h2>' + esc(a.channel || "no channel") + '</h2></div>';
  var body = block("What died", [
    ["Step", a.step || "—"],
    ["Channel", a.channel || "—"],
    ["Tries", nf(a.attempts) + " of " + nf(a.maxAttempts)],
    ["Gave up", a.diedAt ? a.diedAt.slice(0, 16).replace("T", " ") : "—"]
  ]) + note("The error", [[advice[0], advice[1]]])
    + '<pre class="dsl">' + esc(a.lastError || "no error recorded") + '</pre>';

  var safety = note("Reviving cannot double-send", [
    ["The key is the action's own.", "It goes back out carrying the "
     + "idempotency key it already had, which is what an expired lease "
     + "already relies on: at-least-once here, exactly-once at the provider."]
  ]);

  if (!LIVE){
    detail.innerHTML = head + body + safety
      + '<div class="block"><p class="pnote"><b>Static preview.</b> '
      + 'Revive and discard work on the served console.</p></div>';
    return;
  }
  detail.innerHTML = head + body + safety
    + '<div class="block"><div class="blabel">Decide</div>'
    + '<div class="actf">'
    + '<label for="ob-reason">Reason, in your own words</label>'
    + '<input id="ob-reason" type="text" maxlength="500" autocomplete="off"'
    + ' placeholder="what changed, or why it is not worth recovering">'
    + '<button class="btn btn-p" id="ob-revive" data-id="' + esc(a.id) + '">'
    + 'Put it back on the wire</button>'
    + '<button class="btn btn-s" id="ob-discard" data-id="' + esc(a.id) + '">'
    + 'Retire it</button>'
    + '<p class="pnote" id="ob-msg" hidden></p>'
    + '</div></div>';
  wireOutboxActions();
}

var OB_REFUSAL = {
  no_reason: "Write why. The row this leaves behind is what somebody reads back with only it.",
  reason_too_short: "Too short to be a reason.",
  reason_says_nothing: "That restates the action instead of explaining it.",
  not_dead: "That action is no longer dead — somebody else acted on it."
};

function wireOutboxActions(){
  var field = document.getElementById("ob-reason");
  var msg = document.getElementById("ob-msg");
  if (!field || !LIVE) return;
  [["ob-revive", "revive"], ["ob-discard", "discard"]].forEach(function(pair){
    var b = document.getElementById(pair[0]);
    if (!b) return;
    b.addEventListener("click", function(){
      var label = b.textContent;
      msg.hidden = true;
      b.disabled = true;
      b.textContent = pair[1] === "revive" ? "Queueing…" : "Retiring…";
      act("/v1/outbox/" + encodeURIComponent(b.dataset.id) + "/" + pair[1],
          "POST", {reason: field.value}).then(function(res){
        if (res.ok){ window.location.reload(); return; }
        b.disabled = false;
        b.textContent = label;
        return res.json().then(function(body){
          var key = body && body.detail && body.detail.refused;
          msg.textContent = OB_REFUSAL[key]
            || (res.status === 403 ? "Not permitted." : "Failed (" + res.status + ").");
          msg.hidden = false;
        }).catch(function(){
          msg.textContent = "Failed (" + res.status + ").";
          msg.hidden = false;
        });
      }).catch(function(){
        b.disabled = false;
        b.textContent = label;
        msg.textContent = "Failed (network).";
        msg.hidden = false;
      });
    });
  });
}

/* ── spend ─────────────────────────────────────────────────────────────
   The number the customer is charged on. GET /v1/billing/current answered it
   from the day billing existed and no screen asked. */
function renderSpend(){
  var S = D.spendView;
  if (!S){
    document.getElementById("shown").textContent = "0";
    list.innerHTML = empty("No billing period is open.");
    detail.innerHTML = "";
    foot([]);
    return;
  }
  document.getElementById("shown").textContent = nf(S.consumed);
  var pct = Math.round((S.shareUsed || 0) * 100);
  var tone = pct >= 100 ? "bad" : S.alerting ? "warn" : "ok";
  kpis([
    {label: "Credits consumed", value: nf(S.consumed)},
    {label: "Remaining", value: nf(S.remaining), unit: "of " + nf(S.included)},
    {label: "Ceiling used", value: pct + "%", share: S.shareUsed || 0,
     unit: S.alerting ? "past the 80% alert" : "the alert is at 80%", tone: tone},
    {label: "Plan", value: S.plan, unit: "billed monthly"}
  ]);

  var rows = (S.byKind || []).map(function(k){
    return rowOf([dot(""), cell(k.kind, "k m"), cell(nf(k.credits) + " cr", "n"),
                  cell(nf(k.events), "n"), cell("€" + k.costEur.toFixed(4), "n")]);
  }).join("");

  list.innerHTML = rows || empty("Nothing billed yet this period.");
  detail.innerHTML = block("This period", [
    ["Plan", S.plan],
    ["Included", nf(S.included)],
    ["Consumed", nf(S.consumed), "hi"],
    ["Remaining", nf(S.remaining)],
    ["Of the ceiling", pct + "%", S.alerting ? "hi" : ""]
  ]) + costPerContactBlock(S.costPerContact) + note("The ceiling", [
    ["Alerts at 80%.", "Finding out at the ceiling is finding out too late."],
    ["Above the plan.", "Overage is graduated over the overage alone."],
    ["Raising it is deliberate.", "Nobody overspends by accident."]
  ]);
  foot([[nf(S.consumed), "credits consumed"], [nf(S.remaining), "left"],
        [pct + "%", "of the ceiling"]]);
}

/* ── policy ────────────────────────────────────────────────────────────
   Grouped by rule rather than by contact. One contact denied once is a
   correct denial; one rule denying four fifths of a program is a program to
   fix, and only the second grouping shows it. */
function renderPolicy(){
  var P3 = D.policyView || {recent: [], byRule: [], totals: {}};
  var recent = P3.recent || [], rules = P3.byRule || [], tt = P3.totals || {};
  document.getElementById("shown").textContent = recent.length;

  if (!recent.length){
    list.innerHTML = empty("No policy decision recorded yet. Every send records one, "
      + "allow or deny, with the rule that produced it.");
    detail.innerHTML = block("Decisions", [["Allowed", "0"], ["Denied", "0"]]);
    foot([]);
    return;
  }

  var rows = sect("By rule", nf(rules.length)) + rules.map(function(r){
    return rowOf([dot(r.deny ? "deny" : "live"), cell(r.rule, "k m"),
                  cell(nf(r.allow + r.deny) + " total", "m"),
                  cell(nf(r.deny) + " denied", "m" + (r.deny ? " bad" : "")),
                  cell(r.deny && !r.allow ? "always denies" : "", "m")]);
  }).join("");

  rows += sect("Recent decisions", nf(recent.length)) + recent.map(function(d){
    return rowOf([dot(d.decision === "allow" ? "live" : "deny"), cell(d.subject, "k"),
                  cell(d.channel, "m"), cell(d.rule, "m"),
                  cell(d.rationale || d.jurisdiction, "m")], "sub");
  }).join("");

  kpis([
    {label: "Allowed", value: nf(tt.allow || 0), tone: "good"},
    {label: "Denied", value: nf(tt.deny || 0),
     unit: "by the gate", tone: tt.deny ? "bad" : ""},
    {label: "Share denied", value: tt.denyRate === null || tt.denyRate === undefined
        ? "—" : Math.round(tt.denyRate * 100) + "%",
     unit: "of every decision recorded",
     share: tt.denyRate || 0, tone: (tt.denyRate || 0) > 0.5 ? "warn" : "ok"},
    {label: "Rules that fired", value: nf(rules.length),
     unit: (P3.jurisdictions || []).length + " jurisdictions"}
  ]);

  list.innerHTML = rows;
  detail.innerHTML = block("Decisions", [
    ["Allowed", nf(tt.allow || 0)],
    ["Denied", nf(tt.deny || 0), tt.deny ? "hi" : ""],
    ["Share denied", tt.denyRate === null || tt.denyRate === undefined
        ? "—" : Math.round(tt.denyRate * 100) + "%"],
    ["Distinct rules", nf(rules.length)]
  ]) + block("Jurisdictions", (P3.jurisdictions || []).map(function(j){
    return [j, "pack v1"];
  }));
  foot([[nf(tt.allow || 0), "allowed"], [nf(tt.deny || 0), "denied"],
        [nf(rules.length), "rules fired"]]);
}

/* ── audit log ─────────────────────────────────────────────────────────
   Not what the system did — which human authorised it. That is the question
   an audit asks, and the answer was only reachable from a SQL prompt. */
function renderAudit(){
  var A = D.auditView || {entries: [], byAction: [], actors: []};
  var entries = A.entries || [];
  document.getElementById("shown").textContent = entries.length;

  if (!entries.length){
    list.innerHTML = empty("Nothing recorded yet. Issuing a key, publishing a program or "
      + "approving a draft each writes a line here.");
    detail.innerHTML = block("Audit", [["Entries", "0"]]);
    foot([]);
    return;
  }

  // A dot the same colour on every row says nothing. An auditor scans for
  // what was taken away, so revoking, pausing and rejecting are marked and
  // rotation is marked differently: it is a key that stopped working.
  function weight(action){
    if (/revoked|rejected|paused|deleted/.test(action)) return "deny";
    if (/rotated|overridden|waived/.test(action)) return "warn";
    return "live";
  }
  var removals = entries.filter(function(e){ return weight(e.action) !== "live"; }).length;
  kpis([
    {label: "Entries", value: nf(entries.length)},
    {label: "Actors", value: nf((A.actors || []).length), unit: "keys"},
    {label: "Kinds of action", value: nf((A.byAction || []).length)},
    {label: "Removals and rotations", value: nf(removals),
     unit: "of what is shown", tone: removals ? "warn" : ""}
  ]);

  list.innerHTML = entries.map(function(e){
    return rowOf([dot(weight(e.action)), cell(e.action, "k m"), cell(e.actor, "m"),
                  cell(e.subject, "m"),
                  cell(String(e.at).slice(0, 16).replace("T", " "), "n")]);
  }).join("");

  var per = {};
  entries.forEach(function(e){ per[e.actor] = (per[e.actor] || 0) + 1; });
  detail.innerHTML = block("By action", (A.byAction || []).slice(0, 8).map(function(b){
    return [b.action, nf(b.count)];
  })) + block("Actors", (A.actors || []).map(function(a){
    return [a, nf(per[a] || 0) + " here"];
  }));
  foot([[nf(entries.length), "entries"], [nf((A.actors || []).length), "actors"],
        [nf((A.byAction || []).length), "kinds"]]);
}

function render(){
  // The chrome first, always: the columns a view's rows are about to fill are
  // the columns its header has to name. Doing it inside each renderer is how
  // five of them came to share the Programs header.
  chrome(state.view);
  kpis([]);
  if (state.view === "prospects"){ renderProspects(); return; }
  if (state.view === "signals"){ renderSignals(); return; }
  if (state.view === "spend"){ renderSpend(); return; }
  if (state.view === "policy"){ renderPolicy(); return; }
  if (state.view === "audit"){ renderAudit(); return; }
  if (state.view === "sending"){ renderSending(); return; }
  if (state.view === "review"){ renderReviewList(); renderReviewDetail(); return; }
  if (state.view === "today"){ renderToday(); return; }
  if (state.view === "tasks"){ renderTasks(); return; }
  if (state.view === "outbox"){ renderOutbox(); return; }
  renderList();
  renderDetail();
}

document.querySelectorAll("nav a[data-view]").forEach(function(a){
  a.addEventListener("click", function(e){ e.preventDefault(); show(a.dataset.view); });
});

/* Restored here rather than beside `state`, because `rememberedView` reads
   `VIEWS` to refuse a view this build no longer has — and `VIEWS` is declared
   further down. Called earlier it threw, its own catch swallowed the throw,
   and the restore silently never happened. A guard that catches its own bug
   is worse than no guard: this one is placed where its dependency exists.

   The rail is marked to match. A rail that says Today while the table shows
   Spend is a surface an operator cannot trust about anything else either. */
state.view = rememberedView() || state.view;
document.querySelectorAll("nav a[data-view]").forEach(function(a){
  if (a.dataset.view === state.view) a.setAttribute("aria-current", "page");
  else a.removeAttribute("aria-current");
});

render();
})();
</script>
</body>
</html>
