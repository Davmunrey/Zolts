<!doctype html>
<html lang="en">

<title>Zolts — Program Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Zolts product surface — implements DESIGN.md and docs/27 (the brand).
   Rebuilt as an operator surface rather than a report. The list is the page:
   no cards, no metric-tile row, no section headings with subtitles. Content
   sits on canvas separated by hairlines, the way a tool people live in for
   eight hours a day is built.

   The ground is paper, not a dark dashboard: a technical drawing you could
   hand to an auditor rather than the violet-on-near-black every GTM tool has
   shipped since 2023. Chrome carries the steel accent; it never enters a data
   region. Inside a chart, table or figure, colour means one thing only, and
   the five semantics below are the whole vocabulary. */
:root{
  --canvas:#f2f2f3; --surface-1:#ededef; --surface-2:#e7e7ea; --surface-3:#dcdce0; --raised:#fbfbfc;
  --hairline:#d5d5d9; --hairline-strong:#b7b7ba; --hairline-ghost:#e7e7ea;
  --line:var(--hairline);
  --ink:#1d1f20; --ink-muted:#3c3c3e; --ink-secondary:#4b4b4e; --ink-subtle:#55555a;
  --ink-tertiary:#6f6f72; --ink-inverse:#f2f2f3;

  /* Steel, one accent, on a ramp generated in OKLCH whose 500 step is the
     declared brand value #5980A6 rather than an approximation of it. 500
     measures 3.71:1 on paper — chrome, icons and headline scale only — so
     paragraph-size type in the accent takes 700, which measures 7.40:1.
     `scripts/build_site.py` never sees these as anything but text; the
     contrast figures are asserted in `tests/test_brand.py`. */
  --steel-100:#eef4fb; --steel-200:#d6e4f2; --steel-300:#b7cfe7; --steel-400:#91b3d4;
  --steel-500:#5980a6; --steel-600:#446a8f; --steel-700:#2f5171; --steel-800:#1d3a54;
  --steel-900:#0d2438;
  --accent:var(--steel-500); --accent-hover:var(--steel-600);
  --accent-dim:var(--steel-100); --accent-ring:var(--steel-700); --accent-text:var(--steel-700);

  /* The five data semantics. Every one is a deep step: legible at 13px on
     paper and desaturated enough that five on one dense screen read as one
     family. That family resemblance is also the hazard — lift and control sit
     2.5 ΔE apart under deuteranopia — so no figure separates two arms by hue
     alone. See docs/27: the treatment arm is a solid fill and the control arm
     is hatched on the mark's own 45° axis. */
  --lift:#2f6b4f; --control:#5d5d60; --deny:#8a3a34; --review:#7a5a1e; --live:#2c455d;
  --lift-dim:#dbe2df; --deny-dim:#e6dcdc; --review-dim:#e4e0d9; --live-dim:#dadde1;

  --sans:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--canvas); color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.5; letter-spacing:-.06px; -webkit-font-smoothing:antialiased;
}
.mono,code,pre,.n{font-family:var(--mono); font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent-ring); outline-offset:1px; border-radius:3px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── three panes: rail, list, detail. The list is the protagonist. ─────── */
/* The middle column used to take every pixel a wide screen had: at 1920 a
   four-row table stretched across 1,360px with a dead tail on the right, and
   the panel that holds the density stayed at 340px. The table stops at a
   width a person can read across; the surplus goes to the panel. */
.app{display:grid; grid-template-columns:216px minmax(0,1fr) clamp(340px,25vw,470px);
     height:100vh; overflow:hidden}

/* ── rail ─────────────────────────────────────────────────────────────── */
.rail{border-right:1px solid var(--hairline); display:flex; flex-direction:column; padding:10px 8px; gap:18px; overflow-y:auto}
.ws{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;width:100%;text-align:left;
    transition:background 90ms var(--ease)}

/* The mark and wordmark. Clear space is the extrusion depth, 11% of the
   mark box, on all four sides; tracking on ZOLTS is fixed at 0.08em and is
   never set tighter and never lowercase. */
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px 0}
.brand .zmark{width:20px;height:20px;flex:none;display:block}
.wordmark{font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--ink)}
/* 18px is the minimum mark size, and it is the avatar case: on a steel
   field, below 28px, the extrusion goes flat and the mark is a single
   paper silhouette. Square corners — rounding them is forbidden. */
.ws .glyph{width:18px;height:18px;background:var(--steel-600);
           display:grid;place-items:center;flex:none}
.ws .glyph svg{width:11px;height:11px;display:block}
.ws .name{font-weight:550;font-size:13px;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .chev{color:var(--ink-tertiary);flex:none}
nav{display:flex;flex-direction:column;gap:1px}
.sec{font-size:11px;font-weight:550;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-tertiary);padding:8px 8px 4px}
nav a{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:5px;
      color:var(--ink-subtle);text-decoration:none;transition:background 90ms var(--ease),color 90ms var(--ease)}

nav a[aria-current="page"]{background:var(--accent-dim);color:var(--ink)}
nav svg{width:13px;height:13px;flex:none;opacity:.9}
nav .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-tertiary)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 6px}
.hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-tertiary)}
kbd{font:450 10px/1 var(--mono);color:var(--ink-subtle);background:var(--surface-2);
    border:1px solid var(--hairline);border-bottom-width:2px;border-radius:3px;padding:3px 4px}

/* ── centre: filter bar + list, both full-bleed on canvas ─────────────── */
.centre{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--hairline)}
.bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-bottom:1px solid var(--hairline);flex:none}
.bar h1{margin:0;font-size:13px;font-weight:550;letter-spacing:-.1px}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary)}
.grow{flex:1}
.chipbtn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:5px;
         font-size:12px;color:var(--ink-subtle);border:1px solid transparent;transition:background 90ms var(--ease)}

.chipbtn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--hairline)}
.chipbtn svg{width:11px;height:11px}

/* One grid, declared per view. The header and the rows read the same custom
   property, so a view cannot label a column the rows do not fill — which is
   exactly what happened when five views were added against the Programs
   header and every one of them showed PROGRAM · BLUEPRINT · ENROLLED. */
.centre{--cols:22px minmax(140px,1.35fr) minmax(120px,.95fr) 70px 78px 58px 56px 26px}
.head{display:grid;grid-template-columns:var(--cols);
      gap:12px;align-items:center;height:28px;padding:0 14px;border-bottom:1px solid var(--hairline);
      font-size:11px;font-weight:550;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-tertiary);flex:none}
.head .r{text-align:right}
/* Below the last row the table keeps its ruling, so a short list reads as a
   table that ended rather than as a hole in the page. Four mailboxes in a
   1080px column left three quarters of the screen as flat black; the guide is
   the same hairline the rows use, at the same pitch. */
.list{overflow-y:auto;flex:1;
      background-image:repeating-linear-gradient(to bottom,
        transparent 0 35px, var(--hairline-ghost) 35px 36px)}
/* Rows are opaque so they sit on the guide rather than under it. */
.row,.sect,.list .head{background:var(--canvas)}
.row{display:grid;cursor:pointer;grid-template-columns:var(--cols);
     gap:12px;align-items:center;height:36px;padding:0 14px;width:100%;text-align:left;
     border-bottom:1px solid var(--hairline);position:relative;
     transition:background 90ms var(--ease)}

/* Every cell is one line. A wrapped cell grew its row into the next one and
   the list became unreadable the moment a value was longer than the column
   built for a different view; the full value is on the title attribute. */
.cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-size:12px;color:var(--ink-muted)}
.cell.k{font-size:13px;color:var(--ink)}
.cell.m{font-family:var(--mono);font-size:11.5px;color:var(--ink-subtle)}
.cell.r{text-align:right;font-variant-numeric:tabular-nums}
.cell.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.cell.good{color:var(--lift)} .cell.bad{color:var(--deny)} .cell.warnt{color:var(--review)}
/* A rationale is a sentence. No column width fits "whatsapp requires consent,
   contact has none on record" on one line, so the column that carries prose
   declares itself with "w:" in the head spec and wraps to at most two lines;
   the row grows once, by a known amount, and the guard knows which views. */
/* The editor. Inputs carry the schema's own min/max/pattern, so the browser
   refuses an out-of-range value before the server has to. */
.fields{display:grid;gap:12px}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px);gap:4px 10px;align-items:center}
.field label{font-size:11.5px;color:var(--ink-secondary);font-family:var(--mono);
  white-space:normal;line-height:1.35;overflow-wrap:anywhere}
.field input,.field select{font:450 12px/1 var(--mono);color:var(--ink);
  background:var(--surface-2);border:1px solid var(--hairline);border-radius:4px;
  padding:6px 8px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:2px solid var(--accent-ring);outline-offset:-1px}
.field input:invalid{border-color:var(--deny);background:var(--deny-dim,var(--surface-2))}
.field .bound{grid-column:2;font:450 10.5px/1 var(--mono);color:var(--ink-tertiary);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* The sending switch. A reason is required, so the field is the size of a
   sentence rather than the size of a number: a box that fits six characters
   asks for six characters, and what comes back is "fixed". */
.actf{display:grid;gap:8px;margin-top:10px}
.actf label{font-size:11.5px;color:var(--ink-secondary);font-family:var(--mono)}
.actf input{font:450 12px/1.35 var(--mono);color:var(--ink);background:var(--surface-2);
  border:1px solid var(--hairline);border-radius:4px;padding:8px;width:100%;min-width:0}
.actf input:focus{outline:2px solid var(--accent-ring);outline-offset:-1px}
.actf input::placeholder{color:var(--ink-tertiary)}
.actf .btn{justify-self:start}
.actf #sc-msg{color:var(--deny);margin:0}
/* The per-contact timeline. A kind chip and a time, then the row; the
   sentence that says what a row proves lives under it in `.why`. */
.tlrow{display:block;padding:6px 0;border-top:1px solid var(--hairline)}
.tlrow:first-of-type{border-top:0}
.tlt{color:var(--ink-tertiary);font-size:10.5px}
.tlk{display:inline-block;padding:1px 6px;border-radius:4px;font:550 10px/1.4 var(--mono);
     letter-spacing:.3px;text-transform:uppercase;background:var(--surface-2);color:var(--ink-secondary)}
.tlk.live{color:var(--live)}.tlk.bad{color:var(--deny)}.tlk.warnt{color:var(--review)}
.tld{color:var(--ink-secondary)}
.tldrop{opacity:.8}
.field .why{grid-column:1/-1;margin:0}
.why{font-size:11px;color:var(--ink-tertiary);line-height:1.45}
.dsl{margin:0;padding:10px;max-height:240px;overflow:auto;
  font:450 11px/1.5 var(--mono);color:var(--ink-subtle);
  background:var(--surface-2);border:1px solid var(--hairline);border-radius:4px;
  white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
.cell.w{white-space:normal;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;
        -webkit-line-clamp:2;overflow:hidden;text-overflow:clip}
.row:has(.cell.w){height:auto;min-height:36px;padding-top:6px;padding-bottom:6px}
.row.sub{background:var(--canvas)}
.row.planned{cursor:default;opacity:.62}
.row.planned:hover{background:var(--canvas)}
/* Two different tables in one list need a line between them. Detections and
   watched signals, contacts and accounts, rules and decisions: without this
   the reader cannot tell where one ends. */
.sect{display:flex;align-items:center;gap:10px;height:26px;padding:0 14px;
      border-bottom:1px solid var(--hairline);background:var(--surface-1) !important;
      font-size:10.5px;font-weight:550;letter-spacing:.4px;text-transform:uppercase;
      color:var(--ink-tertiary)}
.sect b{font-family:var(--mono);font-weight:450;color:var(--ink-subtle);letter-spacing:0}
.row.sub .cell.k{color:var(--ink-secondary);padding-left:14px}

.row[aria-selected="true"]{background:var(--surface-2)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.st{width:9px;height:9px;border-radius:50%;flex:none;justify-self:center}
/* A running programme is lifecycle, not measurement. It wore the
   verified-lift green, which inside a table — a data region — said
   "this programme's lift is verified" to anyone reading colour before
   text. Lifecycle is drawn in ink; the five semantics are reserved for
   what was measured. D-56. */
.st.live{background:var(--ink)}
.st.paused{background:var(--ink-tertiary)}
.st.draft{background:transparent;border:1.5px dashed var(--ink-tertiary)}
/* Amber and red never existed. Every warning dot in Sending, Review, Policy
   and Prospects has rendered as nothing since those views shipped — including
   the mailbox in `complaint.alarm`, which is the row that view is for. */
.st.warn{background:var(--review)}
.st.deny{background:var(--deny)}
.pname{display:flex;flex-direction:column;gap:1px;min-width:0}
.pname b{font-weight:450;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname span{font-family:var(--mono);font-size:10.5px;color:var(--ink-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp{font-family:var(--mono);font-size:11px;color:var(--ink-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{font-size:12px;color:var(--ink-muted);text-align:right}
.lift{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.lift.up{color:var(--lift)} .lift.flat{color:var(--control)} .lift.down{color:var(--deny)} .lift.none{color:var(--ink-tertiary)}
.sig{justify-self:center;width:14px;height:14px}
.owner{width:20px;height:20px;border-radius:50%;justify-self:center;display:grid;place-items:center;
       font-size:9.5px;font-weight:550;color:var(--ink);background:var(--surface-3);border:1px solid var(--hairline)}

/* ── detail: a property list, not a stack of cards ────────────────────── */
.foot{display:flex;align-items:center;gap:16px;height:30px;padding:0 14px;flex:none;
      border-top:1px solid var(--hairline);font-size:11.5px;color:var(--ink-tertiary)}
.foot b{font-family:var(--mono);font-weight:450;color:var(--ink-muted)}
.detail{display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.dhead{padding:14px 16px 12px;border-bottom:1px solid var(--hairline)}
.dhead .k{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary);margin-bottom:6px}
.dhead h2{margin:0 0 8px;font-size:15px;font-weight:550;letter-spacing:-.3px;line-height:1.25}
.dactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dactions .btn{white-space:nowrap;flex:none}
.btn{height:26px;padding:0 10px;border-radius:5px;font-size:12px;font-weight:500;
     transition:background 90ms var(--ease), transform 160ms var(--ease)}
.btn:active{transform:scale(.97)}
.chipbtn:active,.row:active,.pitem:active{transform:scale(.99)}
.btn-p{background:var(--accent);color:var(--ink-inverse)}

.btn-s{background:var(--surface-2);color:var(--ink);border:1px solid var(--hairline)}

.block{padding:12px 16px;border-bottom:1px solid var(--hairline)}
/* The jurisdiction switcher. It had no style at all, so six buttons rendered
   as one run of letters — CADEESFRGBUS — in the middle of a section label. */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--surface-2);
     border:1px solid var(--hairline)}
.seg button{padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:10px;
            letter-spacing:.3px;color:var(--ink-tertiary);background:transparent;border:0;
            cursor:pointer;transition:background 90ms var(--ease),color 90ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.blabel{font-size:11px;font-weight:550;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-tertiary);margin-bottom:9px}
.props{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:12px;align-items:baseline}
.props dt{color:var(--ink-subtle);min-width:0}
.props dd{margin:0;font-family:var(--mono);color:var(--ink-muted);text-align:right;white-space:nowrap}
.props dd.hi{color:var(--ink)}
/* A sentence is not a value. Prose in the `dd` column, which is nowrap, ran
   over its own label — "Authentication" and "an unverified domain sends
   nothing" printed on top of each other. */
/* The numbers a view is about, where the eye lands, in the space a wide
   screen was wasting. They were in the side panel, two blocks tall in a
   340px column, under a table that had already used the width. */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;flex:none;
      background:var(--hairline);border-bottom:1px solid var(--hairline)}
.kpi{padding:13px 16px 14px;background:var(--canvas);min-width:0}
.kpi .k{font-size:11px;color:var(--ink-tertiary);letter-spacing:.2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Proportional figures, not tabular: at this size `tabular-nums` gives every
   digit the width of a zero and a number like 141 reads loose. Columns of
   numbers align; a standalone value does not need to. */
.kpi .v{margin-top:5px;font-size:23px;font-weight:600;letter-spacing:-.6px;
        line-height:1.1;color:var(--ink);font-variant-numeric:proportional-nums;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .u{margin-top:3px;font-size:11px;line-height:1.4;color:var(--ink-tertiary)}
.kpi .v.good{color:var(--lift)} .kpi .v.warn{color:var(--review)} .kpi .v.bad{color:var(--deny)}
/* Latency reads as a measurement, never as a verdict. The runtime's own
   p95 wore `good` — the verified-lift green — unconditionally, so a
   slow runtime and a fast one were the same colour, and that colour
   already meant something else on the same screen. D-56. */
.kpi .v.live{color:var(--live)}
/* A ratio against a limit. The fill carries the severity and the track is a
   dim step of the same ramp, so the state reads across the whole bar. */
.meter{margin-top:9px;height:4px;border-radius:9999px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9999px;background:var(--control);
         transition:width 380ms var(--ease)}
.meter.ok{background:var(--lift-dim)} .meter.ok i{background:var(--lift)}
.meter.warn{background:var(--review-dim)} .meter.warn i{background:var(--review)}
.meter.bad{background:var(--deny-dim)} .meter.bad i{background:var(--deny)}
/* Two by two before four can clip: a label that fits at 1920 does not
   fit at 1280, and a truncated unit changes what the number means. */
@media (max-width:1560px){ .kpis{grid-auto-flow:row;grid-template-columns:1fr 1fr} }
@media (max-width:900px){ .kpis{grid-template-columns:1fr} }
.source{margin-bottom:12px;padding-top:12px;border-top:1px solid var(--hairline);
        font-size:11px;line-height:1.55;color:var(--ink-tertiary)}
.source b{display:block;font-weight:500;color:var(--ink-subtle);margin-bottom:2px}
.empty{margin:0;padding:28px 24px;max-width:46ch;font-size:12.5px;line-height:1.6;
       color:var(--ink-tertiary)}
.pnote{margin:0 0 7px;font-size:12px;line-height:1.5;color:var(--ink-subtle)}
.pnote:last-child{margin-bottom:0}
.pnote + .props{margin-top:11px}
.pnote b{font-weight:500;color:var(--ink-muted)}
.arm{display:grid;grid-template-columns:64px 1fr 54px;gap:9px;align-items:center;font-size:12px;margin-bottom:7px}
.arm em{font-style:normal;color:var(--ink-subtle)}
.track{height:4px;border-radius:9999px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:9999px;transform-origin:left;
         transition:transform 380ms var(--ease)}
/* Lift and control are 2.5 ΔE apart under deuteranopia and 8.1 under
   normal vision: as bars side by side they are one colour to a great
   many readers. The brand's own grammar separates them — one solid
   object, everything else a line drawing — so the treatment arm is a
   fill and the withheld arm is hatched, on the 45° axis the mark is
   extruded along. The hue still carries meaning; it is no longer the
   only thing that does. docs/27. */
.arm.t .track i{background:var(--lift)}
.arm.c .track i{background:repeating-linear-gradient(45deg,
  var(--control) 0 2px, transparent 2px 4px), var(--surface-3)}
.arm .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.arm.t .v{color:var(--lift)} .arm.c .v{color:var(--control)}
.note{display:flex;gap:8px;padding:9px 10px;border-radius:5px;font-size:12px;line-height:1.45;margin-top:10px}
.note svg{width:13px;height:13px;flex:none;margin-top:2px}
.note.fail{background:var(--deny-dim);color:var(--ink-muted)} .note.fail svg{color:var(--deny)}
.note.pass{background:var(--lift-dim);color:var(--ink-muted)} .note.pass svg{color:var(--lift)}
.note.open{background:var(--surface-2);color:var(--ink-muted)} .note.open svg{color:var(--ink-tertiary)}
.act{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:baseline;font-size:12px;padding:5px 0;color:var(--ink-subtle)}
.act time{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary)}
.act .g{width:6px;height:6px;border-radius:50%;justify-self:center;margin-top:5px}

/* ── command palette ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:start center;padding-top:14vh;z-index:20}
/* No open animation: ⌘K is a keyboard action run a hundred times a day, and
   animating it makes the tool feel slower than it is. */
.pal{width:min(560px,92vw);background:var(--raised);border:1px solid var(--hairline-strong);border-radius:9px;
     box-shadow:0 18px 48px -14px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.pal input{width:100%;height:44px;padding:0 14px;background:transparent;border:0;outline:0;
           color:var(--ink);font:400 14px/1 var(--sans);letter-spacing:-.1px;border-bottom:1px solid var(--hairline)}
.pal input::placeholder{color:var(--ink-tertiary)}
.pres{max-height:290px;overflow-y:auto;padding:5px}
.pgroup{font-size:10.5px;font-weight:550;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-tertiary);padding:7px 9px 4px}
.pitem{display:flex;cursor:pointer;align-items:center;gap:9px;width:100%;height:32px;padding:0 9px;border-radius:5px;
       text-align:left;color:var(--ink-muted);font-size:13px}
.pitem[data-on="1"]{background:var(--accent-dim);color:var(--ink)}
.pitem .pk{font-family:var(--mono);font-size:10.5px;color:var(--ink-tertiary);margin-left:auto}
.pitem .st{width:7px;height:7px}
.pempty{padding:16px 10px;color:var(--ink-tertiary);font-size:12.5px}

@media (hover:hover) and (pointer:fine){
  .ws:hover{background:var(--surface-2)}
  nav a:hover{background:var(--surface-2);color:var(--ink-muted)}
  .chipbtn:hover{background:var(--surface-2);color:var(--ink-muted)}
  .row:hover{background:var(--surface-1)}
  /* The row whose story the panel is showing. Five views emitted the class
     and nothing styled it, so the console's one gesture — click a row, read
     its story — gave no sign of which row the story belonged to (D-106).
     DESIGN.md names this surface: the accent's own dim, never a semantic. */
  .row.on{background:var(--accent-dim)}
  .btn-p:hover{background:var(--accent-hover)}
  .btn-s:hover{background:var(--surface-3)}
}

/* ── narrow ────────────────────────────────────────────────────────────
   Below 1180px the panel stacks under the list rather than disappearing: on
   Review it is the whole point of the screen, and hiding it made the view
   useless on the device most likely to be reading it at 8am.

   Below 820px the rail used to be `display:none` outright, so a phone landed
   on Programs with no way to reach the other seven views. The console was one
   screen. It is a horizontal strip now — same links, same counts. */
@media (max-width:1180px){
  .app{grid-template-columns:220px minmax(0,1fr); grid-template-rows:1fr auto;
       height:auto; min-height:100vh; overflow:visible}
  .rail{grid-row:1 / span 2; position:sticky; top:0; height:100vh}
  .centre{min-height:100vh}
  .detail{grid-column:2; border-top:1px solid var(--hairline-strong)}
  .list{overflow:visible}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr; grid-template-rows:auto 1fr auto}
  .rail{grid-row:auto; position:static; height:auto; flex-direction:column;
        border-right:0; border-bottom:1px solid var(--hairline);
        padding:8px 0 0; gap:8px}
  .rail > div:first-child{padding:0 12px}
  .rail .sec{display:none}
  /* One scrolling row of destinations. Labels and counts stay: a row of bare
     icons is a quiz. */
  nav{flex-direction:row; gap:4px; overflow-x:auto; padding:0 12px 8px;
      scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{height:30px; padding:0 10px; flex:none; border-radius:999px;
        background:var(--surface-1); white-space:nowrap}
  nav .c{margin-left:4px}
  .rail-foot{display:none}
  .centre{min-height:0}
  .bar{padding:0 12px}
  /* The Programs filters are a desktop refinement; the title and the count
     are what a phone has room for. */
  .bar .chipbtn{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:10px 12px 11px}
  .kpi .v{font-size:19px}
  .head{display:none}
  /* Each row becomes its own block of label/value pairs. */
  .row{grid-template-columns:1fr; height:auto; gap:0; padding:11px 12px 12px;
       align-items:start}
  /* The sub-row's key cell keeps the gutter. Cancelling it put the text
     under the absolutely-positioned status dot, so a mailbox read
     `e@outbound.example` on a phone — the dot sitting on the first
     character of the address an operator uses to tell two mailboxes
     apart. Nothing was clipped and nothing overflowed, so every layout
     check passed; it was visible in a screenshot. D-38. */
  /* Size it here as well as in `.st`. Positioned absolutely inside the
     stacked row it rendered 30px wide — three times its own rule — and
     drew over the first characters of every program name. */
  .row .st{position:absolute; left:12px; top:15px; width:9px; height:9px}
  .cell{white-space:normal; overflow:visible; text-overflow:clip;
        display:flex; gap:8px; padding-left:16px; min-height:19px}
  .cell.k{font-size:14px; font-weight:500; margin-bottom:3px}
  .cell::before{content:attr(data-l); flex:none; width:96px; font-size:11px;
                color:var(--ink-tertiary); text-transform:lowercase}
  .cell.k::before{display:none}
  /* A prose cell clamps to two lines with `display:-webkit-box`, and that
     beats the `display:flex` above — so its label stopped being a flex item,
     lost its 96px column, and rendered as `reasongoogle`. On a phone there is
     no column to protect and no reason to clamp: the cell lays out like every
     other one and the text wraps. D-38. */
  .cell.w{display:flex; -webkit-line-clamp:none; overflow:visible}
  .cell.r,.cell.n{text-align:left}
  .cell:empty{display:none}
  /* The Programs row is the one that builds its own markup. It stacks the
     same way rather than printing four unlabelled numbers down the right. */
  .row .pname{padding-left:16px; margin-bottom:3px}
  .row .bp,.row .n,.row .lift{display:flex; gap:8px; padding-left:16px;
       text-align:left; font-size:12px}
  .row .bp::before,.row .n::before,.row .lift::before{content:attr(data-l);
       flex:none; width:96px; color:var(--ink-tertiary); font-size:11px;
       font-family:var(--sans)}
  /* The icon alone is a symbol nobody has been taught. On a phone it says
     what it means, in the same words the panel uses. */
  .row .sig{justify-self:start; display:flex; align-items:center; gap:8px;
       width:auto; height:auto; margin:5px 0 0 16px; font-size:11px}
  .row .sig::after{content:attr(data-l); color:var(--ink-tertiary);
       font-family:var(--sans)}
  .row .sig svg{width:13px; height:13px; flex:none}
  .row .owner{justify-self:start; margin-left:16px}
  .sect{padding:0 12px}
  .foot{height:auto; padding:10px 12px; flex-wrap:wrap; gap:10px 14px}
  .detail{grid-column:1}
  .source{display:none}
}
@media (prefers-reduced-motion:reduce){
  /* Fewer and gentler, not zero: colour and opacity aid comprehension and
     stay; movement is what causes sickness, so only that is removed. */
  .btn:active,.chipbtn:active,.row:active,.pitem:active{transform:none}
  .track i{transition:none}
}
  /* `pre`, not any `.draft`. A status marker is `<span class="st draft">`,
     so this rule for the generated-copy block was also padding every draft
     status dot by 12px 14px — a 9px dot rendered as a 28x24 rounded block
     over the first character of every program name on a phone. Two meanings
     of one word, one of them a component and one of them a value, colliding
     in the only place they are both visible. D-38. */
  pre.draft{margin:0;padding:12px 14px;white-space:pre-wrap;font:inherit;
    background:var(--surface-2,rgba(127,127,127,.06));border-radius:8px}
  .ev{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5}
  .ev:last-child{border-bottom:0}
  .ev .src{font-size:11px;color:var(--ink-tertiary);text-transform:uppercase;
    letter-spacing:.04em;margin-right:6px}
</style>

/* ── list ──────────────────────────────────────────────────────────── */
var list = document.getElementById("list");
function renderList(){
  var rows = visible();
  document.getElementById("shown").textContent = rows.length;

  var live = rows.filter(function(p){ return p.status === "live"; });
  var proven = rows.filter(sig);
  var enrolled = rows.reduce(function(a, p){ return a + p.enrolled; }, 0);
  var spend = rows.reduce(function(a, p){ return a + p.spend; }, 0);
  kpis([
    {label: "Live programs", value: nf(live.length),
     unit: rows.length - live.length ? (rows.length - live.length) + " not live" : "all live"},
    {label: "With proven lift", value: nf(proven.length),
     unit: "of " + nf(rows.length) + " · the rest cannot resolve one yet",
     tone: proven.length ? "good" : "",
     share: rows.length ? proven.length / rows.length : 0},
    {label: "Accounts enrolled", value: nf(enrolled)},
    {label: "Spend, quarter to date", value: "€" + nf(Math.round(spend))}
  ]);
  document.getElementById("foot").innerHTML =
      '<span><b>' + live.length + '</b> live</span>'
    + '<span><b>' + proven.length + '</b> with proven lift</span>'
    + '<span><b>' + nf(enrolled) + '</b> accounts enrolled</span>'
    + '<span style="margin-left:auto"><b>€' + nf(Math.round(spend)) + '</b> spend, quarter to date</span>';
  list.innerHTML = "";
  rows.forEach(function(p, i){
    var d = p.absLift;
    var cls = d == null ? "none" : p.significant ? "up" : d > 0 ? "flat" : "down";
    var b = document.createElement("div");
    b.className = "row";
    b.id = "row-" + p.key;
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", String(p.key === state.sel));
    b.dataset.k = p.key;
    b.innerHTML =
      '<span class="st ' + p.status + '" title="' + p.status + '"></span>'
    + '<span class="pname"><b>' + p.name + '</b><span>' + p.key + ' · v' + p.version + '</span></span>'
    + '<span class="bp" data-l="blueprint">' + (p.blueprint || "—") + '</span>'
    + '<span class="n" data-l="enrolled">' + (p.enrolled ? nf(p.enrolled) : "—") + '</span>'
    + '<span class="lift ' + cls + '" data-l="lift">' + (d == null ? "—" : (d > 0 ? "+" : "") + d.toFixed(2) + " pp") + '</span>'
    + '<span class="n" data-l="holdout">' + p.holdout + '%</span>'
    + '<span class="n" data-l="p95">' + (p.p95 == null ? "—" : p.p95 + " m") + '</span>'
    + '<span class="sig" data-l="' + (d == null ? "no effect resolvable"
        : sig(p) ? "significant" : "not significant yet") + '" style="color:'
      + (d == null ? "var(--ink-tertiary)" : sig(p) ? "var(--lift)" : "var(--review)") + '">'
      + (d == null ? "" : sig(p) ? ICON_SIG : ICON_UND) + '</span>';
    b.addEventListener("click", function(){
      if (state.sel !== p.key) forgetActivationNote();
      state.sel = p.key; renderList(); renderDetail();
    });
    list.appendChild(b);
  });
  // What the blueprints promise and nothing implements yet. Shown because a
  // list of four programs in a column built for hundreds reads as a product
  // with four programs, and the catalogue is the answer to what else this
  // tenant could turn on. Not clickable: there is nothing behind them.
  var gaps = D.catalogueGaps || [];
  if (gaps.length && !state.live && !state.onlySig){
    list.insertAdjacentHTML("beforeend",
      sect("Planned by the blueprint", nf(gaps.length) + " · not implemented")
      + gaps.map(function(g){
          // Blank, not a dash: a row of five em-dashes reads as data that
          // failed to load rather than a program nobody has written yet.
          var blank = '<span class="cell"></span>';
          return rowOf([dot("draft"), cell(g.key, "k m"), cell(g.blueprint, "m"),
                        blank, blank, blank, blank, blank], "planned");
        }).join(""));
  }
  // The listbox owns focus and names its active option, so a screen reader
  // announces the selection without every row being a tab stop.
  list.setAttribute("aria-activedescendant", rows.length ? "row-" + state.sel : "");
}

/* ── chrome ────────────────────────────────────────────────────────── */
// The rail carried fixed counts from the design pass. On a live tenant a
// wrong number is worse than no number, because it is one a customer acts on.
function renderChrome(){
  function put(id, value){
    var el = document.getElementById(id);
    if (!el) return;
    if (value == null){ el.remove(); return; }
    el.textContent = nf(value);
  }
  var t = D.tenant;
  if (t && t.name) document.getElementById("ws-name").textContent = t.name;
  put("nav-programs", P.length);
  // Drafts waiting for a person, not actions waiting to be sent. Those are
  // different queues and only one of them is somebody's job.
  put("nav-review", D.queue ? (D.queue.review != null ? D.queue.review : D.queue.pending) : null);
  // Open, not overdue. The rail says how much work is waiting; whether any of
  // it is late is a tone on the screen itself, because a count that silently
  // means two different things is worse than two counts.
  put("nav-today", D.attention ? (D.attention.items || []).length : null);
  put("nav-tasks", (D.tasksView && D.tasksView.counts)
        ? D.tasksView.counts.open : null);
  put("nav-outbox", D.outboxView ? D.outboxView.count : null);
  // Sends left today, not mailboxes owned. An operator needs the number that
  // runs out, and an unmanaged fleet shows a dash rather than a zero: no
  // capacity and no control over capacity are opposite situations.
  var P2 = D.prospects || {};
  var pcount = (P2.people || []).length + (P2.accounts || []).length;
  var pn = document.getElementById("nav-prospects");
  if (pn) pn.textContent = nf(pcount);
  // What has fired, not how many distinct signals are armed. The rail count
  // and the view have to be the same number or the operator reads one as a
  // contradiction of the other.
  var sn = document.getElementById("nav-signals");
  if (sn) sn.textContent = nf(((D.signalsView || {}).recent || []).length);
  var spn = document.getElementById("nav-spend");
  if (spn) spn.textContent = D.spendView ? nf(D.spendView.consumed) : "—";
  // Denials, not decisions. The count an operator acts on is the work the
  // policy engine stopped; the total includes every allow and never moves.
  var pol = document.getElementById("nav-policy");
  if (pol) pol.textContent = nf(((D.policyView || {}).totals || {}).deny || 0);
  var aud = document.getElementById("nav-audit");
  if (aud) aud.textContent = nf(((D.auditView || {}).entries || []).length);

  // What this console is reading. The first question when a number looks
  // wrong is whether it came from anywhere, and the page never said.
  var src = document.getElementById("source");
  if (src){
    src.innerHTML = LIVE
      ? '<b>' + esc((D.tenant || {}).name || "This tenant") + '</b>'
        + 'Live data · ' + esc((D.tenant || {}).region || "—")
        + ' · ' + esc((D.tenant || {}).blueprint || "no blueprint")
      : '<b>Demo</b>Computed from this repository\u2019s own programs, '
        + 'blueprints and reference core. No customer data.';
  }

  var F = D.fleet;
  var sending = document.getElementById("nav-sending");
  if (sending) sending.textContent = !F ? "—" : (F.managed ? nf(F.remaining) : "—");
}

/* ── detail ────────────────────────────────────────────────────────── */
var detail = document.getElementById("detail");
/* ── review queue ──────────────────────────────────────────────────────
   Agents propose and the runtime disposes. Until now the disposing was curl:
   the rail counted a queue that led nowhere, which makes product invariant 1
   a claim with no surface behind it. */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderReviewList(){
  document.getElementById("shown").textContent = R.length;

  if (!R.length){
    list.innerHTML = empty("Nothing is waiting for a person. Drafts arrive here when a "
      + "gate declines to send them unattended.");

    return '<div class="row' + (r.id === state.rsel ? " on" : "") + '" data-r="'

function reviewActions(r){
  if (!LIVE){
    return '<button class="btn btn-p" disabled title="Static preview">Approve</button>'
         + '<button class="btn btn-s" disabled>Reject</button>';
  }
  return '<button class="btn btn-p" id="approve" data-id="' + esc(r.id) + '">Approve</button>'
       + '<button class="btn btn-s" id="reject" data-id="' + esc(r.id) + '">Reject</button>';
}

function wireReviewActions(r){
  ["approve", "reject"].forEach(function(verb){
    var b = document.getElementById(verb);
    if (!b) return;
    b.addEventListener("click", function(){
      var both = [document.getElementById("approve"), document.getElementById("reject")];
      both.forEach(function(x){ if (x) x.disabled = true; });
      b.textContent = verb === "approve" ? "Approving…" : "Rejecting…";
      act("/v1/proposals/" + b.dataset.id + "/" + verb).then(function(res){
        if (res.ok){ window.location.reload(); return; }
        both.forEach(function(x){ if (x) x.disabled = false; });
        b.textContent = res.status === 403 ? "Not permitted" : "Failed (" + res.status + ")";
      }).catch(function(){
        both.forEach(function(x){ if (x) x.disabled = false; });
        b.textContent = "Failed (network)";
      });
    });
  });
}

function activationNote(p){
  /* What the last activation answered, on the program it was about. Kept
     until the operator moves to another program, so a re-render does not
     eat it; a note nobody saw is a note that was not given. */
  var raw = null;
  try { raw = sessionStorage.getItem("zolts.activation-note"); } catch (e) {}
  if (!raw) return "";
  var note = null;
  try { note = JSON.parse(raw); } catch (e) { return ""; }
  if (!note || note.id !== p.id || !note.lines || !note.lines.length) return "";
  return '<div class="note fail" id="activation-note">' + ICON_UND
    + '<span><b style="color:var(--ink)">Activated, with a note.</b> '
    + note.lines.map(esc).join(" ") + '</span></div>';
}

function forgetActivationNote(){
  try { sessionStorage.removeItem("zolts.activation-note"); } catch (e) {}
}

function primaryAction(p){
  /* Signup publishes a tenant's starter programs as drafts on purpose: a
     tenant contacting people before anyone has read a program is not
     onboarding, it is an incident. Activating one is therefore the first
     thing a partner must do, and until now there was no button for it. */
  if (!LIVE) return '<button class="btn btn-p" disabled title="Static preview">Publish</button>';
  if (p.status === "live") return '<button class="btn btn-p" disabled>Live</button>';
  return '<button class="btn btn-p" id="activate" data-id="' + p.id + '">Activate</button>';
}

function unverifiedRow(p){
  /* What this number rests on. A reply that arrives without a body is a real
     event and tells us only that a human responded — an unsubscribe written in
     prose looks exactly like interest. Those still count, deliberately:
     correcting it silently would move every tenant's measured lift on a
     deploy. So the share is shown beside the lift rather than mentioned in a
     footnote nobody reaches. Decision 16. */
  if (p.unverifiedShare == null) return "";
  if (!p.unverifiedConversions){
    return '<dt>Conversions read</dt><dd>all ' + nf(p.conversions) + '</dd>';
  }
  var pct = Math.round(p.unverifiedShare * 100);
  return '<dt>Conversions read</dt><dd class="' + (pct >= 25 ? "hi" : "") + '">'
    + nf(p.conversions - p.unverifiedConversions) + ' of ' + nf(p.conversions)
    + ' · ' + pct + '% unread</dd>';
}

/* ---- the editor -------------------------------------------------------
   ADR-002 says the DSL is the source of truth and the UI generates DSL. The
   first half was enforced from the start: `POST /v1/programs` validates a
   whole document against the schema, lints it, checks the holdout and stores
   a new version. The second half was a button labelled "Open in editor" that
   did nothing.

   What this emits is a complete document, never a patch. A patch would make
   the engine the author — it would have to decide how to merge — and two
   authors is precisely the divergence the ADR exists to prevent. The bounds
   on each control come from `D.controls`, which the server derives from the
   schema, so the form cannot offer a value the validator rejects. */

function readPath(node, path){
  var parts = path.split(".");
  for (var i = 1; i < parts.length; i++){          /* skip the "spec" root */
    if (node == null) return undefined;
    node = node[parts[i]];
  }
  return node;
}

function writePath(node, path, value){
  var parts = path.split(".");
  for (var i = 1; i < parts.length - 1; i++){
    if (node[parts[i]] == null) node[parts[i]] = {};
    node = node[parts[i]];
  }
  node[parts[parts.length - 1]] = value;
}

function bump(version){
  /* A new version, never an edit of the published one. Program logic is
     versioned configuration: overwriting v2.1.0 would leave every enrollment
     already running under it pointing at a spec that no longer describes what
     it did. */
  var parts = String(version || "0.0.0").split(".").map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return "0.0.1";
  return parts[0] + "." + parts[1] + "." + (parts[2] + 1);
}

function controlField(c, value){
  var id = "c-" + c.path.replace(/\./g, "-");
  var label = c.path.split(".").slice(1).join(" · ");
  var input;
  if (c.enum){
    input = '<select id="' + id + '" data-path="' + esc(c.path) + '">'
      + c.enum.map(function(o){
          return '<option' + (o === value ? " selected" : "") + '>' + esc(o) + '</option>';
        }).join("") + '</select>';
  } else if (c.type === "number" || c.type === "integer"){
    input = '<input id="' + id + '" data-path="' + esc(c.path) + '" type="number"'
      + (c.minimum != null ? ' min="' + c.minimum + '"' : "")
      + (c.maximum != null ? ' max="' + c.maximum + '"' : "")
      + ' step="' + (c.type === "integer" ? "1" : "any") + '"'
      + ' value="' + (value == null ? "" : esc(String(value))) + '">';
  } else {
    input = '<input id="' + id + '" data-path="' + esc(c.path) + '" type="text"'
      + (c.pattern ? ' pattern="' + esc(c.pattern) + '"' : "")
      + ' value="' + (value == null ? "" : esc(String(value))) + '">';
  }
  var bound = c.enum ? c.enum.length + " choices"
    : c.pattern ? "matches " + c.pattern
    : (c.minimum != null ? c.minimum : "") + "–" + (c.maximum != null ? c.maximum : "∞");
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>'
    + input + '<span class="bound">' + esc(String(bound)) + '</span>'
    + '<p class="why">' + esc(c.note) + '</p></div>';
}

function draftDocument(p){
  /* The document as it stands in the form. Built from the program's own spec
     so every field the console does not tune survives untouched. */
  var spec = JSON.parse(JSON.stringify(p.spec || {}));
  (D.controls || []).forEach(function(c){
    var el = document.getElementById("c-" + c.path.replace(/\./g, "-"));
    if (!el) return;
    var raw = el.value;
    if (raw === "") return;
    var value = (c.type === "number") ? Number(raw)
              : (c.type === "integer") ? parseInt(raw, 10)
              : raw;
    if (typeof value === "number" && isNaN(value)) return;
    writePath(spec, c.path, value);
  });
  var meta = JSON.parse(JSON.stringify(p.meta || {}));
  meta.version = bump(p.version);
  return {apiVersion: "zolts/v1", kind: "Program", metadata: meta, spec: spec};
}

function cleared(p){
  /* A field that had a value and is now empty. Keeping the old number would
     publish something the operator did not see; dropping the key would remove
     a spend ceiling by accident. Neither is safe, so it is refused. */
  return (D.controls || []).map(function(c){
    var el = document.getElementById("c-" + c.path.replace(/\./g, "-"));
    var had = readPath(p.spec || {}, c.path);
    return (el && el.value === "" && had != null) ? c.path : null;
  }).filter(Boolean);
}

function outOfBounds(){
  /* The browser's own validity, which reads the min/max/pattern the schema
     put on the inputs. Reported before the request rather than after, but the
     server validates the same document again — this is a courtesy, not the
     authority. */
  return (D.controls || []).map(function(c){
    var el = document.getElementById("c-" + c.path.replace(/\./g, "-"));
    return (el && !el.checkValidity()) ? c.path : null;
  }).filter(Boolean);
}

function renderEditor(p){
  var body = document.getElementById("tune");
  if (!body) return;
  var document_ = draftDocument(p);
  var bad = outOfBounds().concat(cleared(p));
  var preview = document.getElementById("dsl");
  if (preview) preview.textContent = JSON.stringify(document_, null, 2);
  var out = document.getElementById("pub");
  if (out) out.disabled = !LIVE || bad.length > 0;
  var say = document.getElementById("pubnote");
  var empty = cleared(p);
  if (say) say.textContent = empty.length
    ? "Emptied: " + empty[0].split(".").slice(-1)[0] + ". Removing a ceiling is a decision, not a blank box."
    : bad.length
    ? bad.length + " value" + (bad.length > 1 ? "s" : "") + " outside the schema"
    : !LIVE ? "Static preview: this is the document a publish would send."
    : "Publishes " + document_.metadata.key + " v" + document_.metadata.version + " as a draft.";
}

function editorPanel(p){
  if (!p.spec || !(D.controls || []).length) return "";
  var fields = D.controls.map(function(c){
    return controlField(c, readPath(p.spec, c.path));
  }).join("");
  return '<div class="block" id="tune"><div class="blabel">Tune</div>'
    + '<p class="why" style="margin:0 0 10px">Every bound below is the schema\'s own. '
    + 'Publishing writes a new version — v' + esc(bump(p.version))
    + ' — and never edits the one already running.</p>'
    + '<div class="fields">' + fields + '</div>'
    + '<div class="blabel" style="margin-top:14px">Generated document</div>'
    + '<pre class="dsl" id="dsl"></pre>'
    + '<div class="dactions" style="margin-top:10px">'
    + '<button class="btn btn-p" id="pub"' + (LIVE ? "" : " disabled") + '>Publish version</button>'
    + '<span class="why" id="pubnote"></span></div>'
    + '</div>';
}

function wireEditor(p){
  var panel = document.getElementById("tune");
  if (!panel) return;
  panel.addEventListener("input", function(){ renderEditor(p); });
  panel.addEventListener("change", function(){ renderEditor(p); });
  var out = document.getElementById("pub");
  if (out) out.addEventListener("click", function(){
    var body = draftDocument(p);
    out.disabled = true;
    out.textContent = "Publishing…";
    act("/v1/programs", "POST", {
      key: body.metadata.key, version: body.metadata.version,
      name: body.metadata.name, blueprint: body.metadata.blueprint,
      owner: body.metadata.owner, description: body.metadata.description,
      spec: body.spec
    }).then(function(res){
      if (res.ok){ window.location.reload(); return; }
      /* The server's reason, not a shrug. A 422 here names the field that
         failed, and hiding it would send the operator back to a form that
         looks correct. */
      return res.text().then(function(text){
        out.disabled = false;
        out.textContent = "Publish version";
        var say = document.getElementById("pubnote");
        if (say) say.textContent = res.status === 409
          ? "That version already exists with different content. A published "
            + "version is never rewritten — the one running keeps its spec."
          : "Rejected (" + res.status + "): " + text.slice(0, 160);
      });
    }).catch(function(){
      out.disabled = false;
      out.textContent = "Publish version";
      var say = document.getElementById("pubnote");
      if (say) say.textContent = "Failed (network)";
    });
  });
  renderEditor(p);
}

// The signed artefact, beside the live figure it was frozen from. Written
// once at each period close (ADR-043): what this panel shows in month nine is
// what the partner read in month three, which is the whole point of freezing
// it rather than recomputing it here.
function frozenReports(p){
  var rows = p.reports || [];
  if (!rows.length){
    return '<div class="block"><div class="blabel">Frozen reports</div>'
      + '<p style="margin:0;font-size:12px;color:var(--ink-tertiary);line-height:1.5">'
      + 'None yet. One is frozen for this programme at every billing period close, '
      + 'and it is the document the pilot letter is read against.</p></div>';
  }
  var body = rows.map(function(r){
    var tone = r.verdict === "significant" ? "lift" : "deny";
    return '<div class="act">'
      + '<span class="g" style="background:var(--' + tone + ')"></span>'
      + '<span>' + r.periodStart + ' → ' + r.periodEnd + ' · <b style="color:var(--ink)">'
      + r.verdict + '</b>'
      + (r.liftPp == null ? "" : ' · ' + (r.liftPp > 0 ? "+" : "") + r.liftPp.toFixed(2)
         + ' pp vs ' + (r.mdePp == null ? "—" : r.mdePp.toFixed(2) + ' pp'))
      + ' · ' + (r.pipelineEur != null ? '€' + nf(r.pipelineEur) : "no pipeline figure")
      // Acquisition cost against the ceiling the program declared. All in —
      // the customer's own run-rate plus what Zolts billed — so it sits on the
      // same basis as the baseline cost per meeting it is read against.
      + ' · ' + (r.costPerMeetingEur != null
          ? '€' + nf(r.costPerMeetingEur) + '/meeting' : "no cost per meeting")
      + ' · ' + nf(r.credits) + ' credits'
      + '<br><span class="mono" style="font-size:10.5px;color:var(--ink-tertiary)">'
      + r.digest.slice(0, 32) + '…</span></span>'
      + '<time>' + (r.frozenAt || "").slice(0, 10) + '</time></div>';
  }).join("");
  var first = rows[0];
  // The declared ceiling, drawn beside the figure and never acted on
  // (decision 45): a program is above its cost per meeting every day until the
  // first one lands, so a stop here would kill programs that are working. The
  // period, not the day, is the unit — and the operator decides.
  // Three states, not two: a null is *no figure yet*, and painting it green
  // would tell an operator they are within a budget nothing has measured.
  var breach = first.overCostCeiling;
  var ceiling = first.costPerMeetingCeilingEur == null ? '' :
    '<div class="note ' + (breach == null ? "open" : breach ? "fail" : "pass") + '">'
    + (breach ? ICON_UND : ICON_SIG)
    + '<span>Declared ceiling <b style="color:var(--ink)">€'
    + nf(first.costPerMeetingCeilingEur) + '</b> per meeting. '
    + (breach == null
        ? 'This period has no figure to measure against it: '
          + (first.costPerMeetingWithheld || "nothing to report yet") + '.'
        : 'The period ' + first.periodStart + ' → ' + first.periodEnd + ' finished <b '
          + 'style="color:var(--ink)">' + (breach ? "above" : "within")
          + '</b> it.')
    + ' Reported, never enforced.</span></div>';
  // Whether the cost per meeting rests on a measurement of this period or on
  // the run-rate declared at onboarding. The figure reads the same either way,
  // which is exactly why the panel has to say which (decision 46).
  var basis = first.ownSpendBasis == null ? '' :
    '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink-tertiary);line-height:1.45">'
    + 'Your own go-to-market spend for this period: <b style="color:var(--ink)">€'
    + nf(first.ownSpendEur) + '</b>, '
    + (first.ownSpendBasis === "declared"
        ? 'declared for the period.'
        : 'prorated from the run-rate declared at onboarding. Nothing re-measures that, '
          + 'so declaring the period\'s own spend replaces it.')
    + '</p>';
  return '<div class="block"><div class="blabel">Frozen reports</div>' + body + ceiling + basis
    + '<p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-tertiary);line-height:1.45">'
    + 'Written once and never restated. The digest covers the figures and what they were '
    + 'computed from, so this row and a signed copy can be checked against each other'
    + (first.baselineDigest
        ? '; it quotes the baseline frozen at onboarding.' : '.')
    + ' Cost per meeting is all in: your own go-to-market run-rate for the period plus '
    + 'what Zolts billed, on the same basis as that baseline.'
    + '</p></div>';
}

/* ── what activating it would do today ─────────────────────────────────
   Activate is the scariest click in the product and the one with no preview.
   The number beside the button comes from the same functions that will enrol,
   with the insert taken out, and a test holds that equality. An audience the
   runtime cannot evaluate is reported as that, never as zero: a quiet
   programme and a broken one look identical on a tile and are opposite in
   consequence. */
function loadPreview(id){
  if (!LIVE || state.pvFor === id) return;
  state.pvFor = id; state.pv = null;
  read("/v1/programs/" + encodeURIComponent(id) + "/preview").then(function(res){
    if (!res.ok){ state.pv = {error: "Failed (" + res.status + ")."}; renderDetail(); return; }
    return res.json().then(function(body){
      if (state.pvFor !== id) return;
      state.pv = body; renderDetail();
    });
  }).catch(function(){ state.pv = {error: "Failed (network)."}; renderDetail(); });
}

function previewBlock(p){
  if (!p || !p.id) return "";
  var head = '<div class="block" id="pv"><div class="blabel">'
    + (p.status === "live" ? "What it does now" : "What activating it would do today") + '</div>';
  if (!LIVE) return head + '<p class="pnote"><b>Static preview.</b> The forecast reads live rows on the served console.</p></div>';
  if (state.pvFor !== p.id) { loadPreview(p.id); }
  var v = state.pv;
  if (state.pvFor !== p.id || !v) return head + '<p class="pnote" id="pv-loading">Running the audience…</p></div>';
  if (v.error) return head + '<p class="pnote" id="pv-error"><b>' + esc(v.error) + '</b></p></div>';
  if (v.answerable === false){
    return head + '<p class="pnote" id="pv-unanswerable"><b>The audience cannot be evaluated.</b> '
      + esc(String(v.reason || "").replace(/[.\s]*$/, ".")) + ' Live, this programme would enrol nobody and say nothing about it.</p></div>';
  }
  var week = v.weekOne || {steps: []};
  var sending = week.steps.filter(function(x){ return x.channel; }).length;
  var blocked = v.policy && v.policy.blockedByRule ? v.policy.blockedByRule : {};
  var rules = Object.keys(blocked);
  var rows = [
    ["Would enrol now", nf(v.audience) + (v.audience === 1 ? " account" : " accounts"), v.audience ? "hi" : ""],
    ["Held out", nf(v.control) + " (control, never contacted)"],
    ["Reached", nf(v.treatment) + " (treatment)"],
    ["Steps in week one", nf(week.steps.length) + (sending ? ", " + nf(sending) + " sending" : ", none sending")
      + (v.tier ? " · " + v.tier : "")],
    ["Sends, at most", nf(week.sendsAtMost || 0)],
    ["Credits, at most", nf(Math.round((week.creditsAtMost || 0) * 10) / 10)]
  ];
  Object.keys(v.headroom || {}).forEach(function(t){
    rows.push(["Capacity left · " + t, nf(v.headroom[t]) + " this week"]);
  });
  var policy = v.policy && v.policy.sampled
    ? (rules.length
        ? '<p class="pnote"><b>Policy would refuse ' + esc(rules.map(function(r){ return nf(blocked[r]) + " under " + r; }).join(", "))
          + '</b> of a sample of ' + nf(v.policy.sampled) + '. The rule, not the count, is what to fix before Activate.</p>'
        : '<p class="pnote"><b>Policy allows all ' + nf(v.policy.sampled) + ' sampled contacts</b> for the first sending step.</p>')
    : '<p class="pnote">No contact to run the policy against yet.</p>';
  return head + '<dl class="props">' + rows.map(function(kv){
      return '<dt>' + esc(kv[0]) + '</dt><dd' + (kv[2] ? ' class="' + kv[2] + '"' : "") + '>' + esc(kv[1]) + '</dd>';
    }).join("") + '</dl>' + policy
    + '<p class="why">A forecast as of ' + esc((v.asOf || "").slice(0, 16).replace("T", " "))
    + ' UTC, from the audience and capacity as they stand, by the same functions that enrol. Week one is an upper bound: every reached contact through every step inside seven days.</p></div>';
}

function renderDetail(){
  var p = P.find(function(x){ return x.key === state.sel; });
  if (!p){ detail.innerHTML = ""; return; }
  var has = p.treat != null, d = p.absLift, ok = p.significant;
  var resolvable = has && d != null && p.mde != null;

  var evidence = !resolvable
    ? '<p style="margin:0;font-size:12px;color:var(--ink-tertiary);line-height:1.5">'
      + (p.unresolvedReason
           // Say why. A bare dash reads as a rendering fault, and an operator
           // who cannot tell "not yet" from "broken" stops trusting the screen.
           ? 'No effect resolvable: ' + p.unresolvedReason + '.'
           : 'No enrollments yet. Evidence appears once the control group fills.')
      + '</p>'
    : '<div class="arm t"><em>Treatment</em><span class="track"><i style="transform:scaleX('
        + Math.min(1, p.treat / 25).toFixed(3) + ')"></i></span><span class="v">'
        + p.treat.toFixed(2) + '%</span></div>'
    + '<div class="arm c"><em>Control</em><span class="track"><i style="transform:scaleX('
        + Math.min(1, p.ctrl / 25).toFixed(3) + ')"></i></span><span class="v">'
        + p.ctrl.toFixed(2) + '%</span></div>'
    + '<dl class="props">'
      + '<dt>Absolute lift</dt><dd class="hi">' + (d > 0 ? "+" : "") + d.toFixed(2) + ' pp</dd>'
      + '<dt>Minimum detectable effect</dt><dd class="hi">' + p.mde.toFixed(2) + ' pp</dd>'
      + '<dt>Treatment · control</dt><dd>' + nf(p.nTreat) + ' · ' + nf(p.nControl) + '</dd>'
      + unverifiedRow(p)
      + '<dt>Opportunities (t · c)</dt><dd>' + nf(p.oppTreat) + ' · ' + nf(p.oppControl) + '</dd>'
      + '<dt>Incremental pipeline</dt><dd>'
        + (p.pipeline != null ? "€" + nf(p.pipeline) : "not reported") + '</dd>'
    + '</dl>'
    + '<div class="note ' + (ok ? "pass" : "fail") + '">'
      + (ok ? ICON_SIG : ICON_UND)
      + '<span>' + (ok
          ? 'Lift clears the detectable effect against a concurrent control.'
          : 'Lift sits below what this design can resolve, so it is not reported as '
            + 'incremental. A <b style="color:var(--ink)">' + (p.neededHoldout || "larger")
            + '%</b> holdout would resolve it at this sample size.')
      + '</span></div>'
    // Euros come from deals. The pipeline figure rests on the opportunity
    // comparison and on the tenant's own average deal, so it is reported and
    // withheld on its own terms rather than on the reply rate's.
    + '<div class="note ' + (p.pipeline != null ? "pass" : "fail") + '">'
      + (p.pipeline != null ? ICON_SIG : ICON_UND)
      + '<span>' + (p.pipeline != null
          ? '<b style="color:var(--ink)">€' + nf(p.pipeline) + '</b> of pipeline, from '
            + nf(p.incrementalOpportunities) + ' opportunities the holdout says would not '
            + 'exist, at your own average of €' + nf(p.avgOpportunityEur) + ' over '
            + nf(p.opportunitiesWithAmount) + ' deals.'
          : 'No pipeline figure: ' + (p.pipelineWithheld || "nothing to report yet")
            + '. A reply is not a deal, so replies are never priced as one.')
      + '</span></div>';

  var trace = (D.decisions[state.jur] || []).map(function(r){
    return '<div class="act"><span class="g" style="background:var(--'
         + (r.decision === "allow" ? "lift" : "deny") + ')"></span>'
         + '<span>' + r.account + ' · <span class="mono" style="font-size:11px">'
         + r.channel + '</span></span>'
         + '<time>' + r.rule + '</time></div>';
  }).join("");

  detail.innerHTML =
    '<div class="dhead">'
      + '<div class="k">' + p.key + ' · v' + p.version + ' · ' + p.specHash + '</div>'
      + '<h2>' + p.name + '</h2>'
      + '<div class="dactions">' + primaryAction(p)
      + '<button class="btn btn-s" id="tunebtn" aria-expanded="' + (state.tuning ? "true" : "false")
      + '">' + (state.tuning ? "Close editor" : "Open editor") + '</button></div>'
    + '</div>'
    + activationNote(p)
    + previewBlock(p)
    + '<div class="block"><div class="blabel">Evidence</div>' + evidence + '</div>'
    + frozenReports(p)
    + '<div class="block"><div class="blabel">Configuration</div><dl class="props">'
      + '<dt>Status</dt><dd class="hi">' + p.status + '</dd>'
      + '<dt>Blueprint</dt><dd>' + p.blueprint + '</dd>'
      + '<dt>Primary metric</dt><dd>' + p.metric
        + (p.metricTestsValue
             // A value metric's event is tested and its amount is not, and a
             // screen that did not say so would let the reader assume it was.
             ? ' <span style="color:var(--ink-tertiary)">· amount reported, not tested</span>'
             : '') + '</dd>'
      + '<dt>Holdout</dt><dd class="hi">' + p.holdout + '%</dd>'
      + '<dt>Enrolled</dt><dd>' + (p.enrolled ? nf(p.enrolled) : "—") + '</dd>'
      + '<dt>Signal → action p95</dt><dd>' + (p.p95 == null ? "—" : p.p95 + " min") + '</dd>'
      + '<dt>Spend (QTD)</dt><dd>€' + p.spend.toFixed(2) + '</dd>'
      + '<dt>Monthly budget</dt><dd>' + nf(p.budget) + ' credits</dd>'
    + '</dl>'
    // What the metric counts, as a sentence rather than a cell: the props
    // list is a two-column grid and a sentence in it clipped every term
    // beside it.
    + '<p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-tertiary);line-height:1.45">'
      + 'Counted as ' + (p.metricCounts || 'any recorded conversion') + '.'
      + (p.metricTestsValue
           ? ' The amount is reported beside the count and is not tested.' : '')
    + '</p></div>'
    + '<div class="block"><div class="blabel">Triggers</div><dl class="props">'
      + p.signals.map(function(sg){
          return '<dt style="font-family:var(--mono);font-size:11.5px">' + sg + '</dt>'
               + '<dd>armed</dd>'; }).join("")
    + '</dl></div>'
    + (state.tuning ? editorPanel(p) : "")
    + '<div class="block" style="border-bottom:0">'
      + '<div class="blabel" style="display:flex;align-items:center;gap:8px">Policy decisions'
      + '<span class="seg" style="margin-left:auto" id="jur">'
      + D.jurisdictions.map(function(j){
          return '<button data-j="' + j + '" aria-pressed="' + (j === state.jur) + '">'
               + j + '</button>'; }).join("")
      + '</span></div>' + trace
      + '<p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-tertiary);line-height:1.45">'
      + 'Evaluated by the policy engine, not transcribed. Switching jurisdiction '
      + 'replays the same actions against that pack.</p>'
    + '</div>';

  var tuner = document.getElementById("tunebtn");
  if (tuner) tuner.addEventListener("click", function(){
    state.tuning = !state.tuning;
    renderDetail();
  });
  if (state.tuning) wireEditor(p);

  var seg = document.getElementById("jur");
  if (seg) seg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-j]");
    if (!b) return;
    state.jur = b.dataset.j;
    renderDetail();
  });

  var go = document.getElementById("activate");
  if (go) go.addEventListener("click", function(){
    go.disabled = true;
    go.textContent = "Activating…";
    act("/v1/programs/" + go.dataset.id + "/activate").then(function(res){
      if (res.ok) {
        /* The answer can carry a note — no baseline is frozen, for one — and
           a reload discarded it. Decision 35 says noted where an operator
           looks, and this is where they look: kept across the reload and
           shown on the program it was about. */
        return res.json().then(function(body){
          try {
            if (body && body.lint && body.lint.length)
              sessionStorage.setItem("zolts.activation-note",
                JSON.stringify({id: go.dataset.id, lines: body.lint}));
          } catch (e) {}
          window.location.reload();
        });
      }
      /* Named, not swallowed. A button that fails quietly is the reason the
         console shipped with buttons that did nothing at all. */
      go.disabled = false;
      go.textContent = res.status === 403 ? "Session expired" : "Failed (" + res.status + ")";
    }).catch(function(){
      go.disabled = false;
      go.textContent = "Failed (network)";
    });
  });
}

/* ── filters ───────────────────────────────────────────────────────── */
function toggle(id, key){
  var b = document.getElementById(id);
  b.addEventListener("click", function(){
    state[key] = !state[key];
    b.setAttribute("aria-pressed", String(state[key]));
    var rows = visible();
    if (rows.length && !rows.some(function(p){ return p.key === state.sel; })) state.sel = rows[0].key;
    renderList(); renderDetail();
  });
}
toggle("f-live", "live");
toggle("f-sig", "onlySig");

/* ── keyboard: j/k move, enter opens, ⌘K palette ───────────────────── */
function move(step){
  var rows = visible();
  if (!rows.length) return;
  var i = rows.findIndex(function(p){ return p.key === state.sel; });
  state.sel = rows[Math.max(0, Math.min(rows.length - 1, (i < 0 ? 0 : i) + step))].key;
  renderList(); renderDetail();
  var el = list.querySelector('[aria-selected="true"]');
  if (el) el.scrollIntoView({ block: "nearest" });
}

var scrim = document.getElementById("scrim"),
    q = document.getElementById("q"),
    pres = document.getElementById("pres"),
    palIndex = 0, palItems = [];

var lastFocus = null;
var appEl = document.querySelector(".app");

function palOpen(){
  lastFocus = document.activeElement;
  scrim.hidden = false;
  scrim.querySelector(".pal").dataset.state = "open";
  document.body.style.overflow = "hidden";        // scroll lock
  appEl.setAttribute("aria-hidden", "true");      // background out of the a11y tree
  appEl.setAttribute("inert", "");
  q.value = ""; palIndex = 0; palRender(); q.focus();
}

function palClose(){
  scrim.hidden = true;
  scrim.querySelector(".pal").dataset.state = "closed";
  document.body.style.overflow = "";
  appEl.removeAttribute("aria-hidden");
  appEl.removeAttribute("inert");
  // Focus returns where it came from; losing it to <body> strands keyboard users.
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}

function palRender(){
  var term = q.value.trim().toLowerCase();
  var progs = P.filter(function(p){
    return !term || p.name.toLowerCase().indexOf(term) > -1 || p.key.indexOf(term) > -1 || p.blueprint.indexOf(term) > -1;
  });
  var cmds = [
    { label: "Toggle live only", key: "L", run: function(){ document.getElementById("f-live").click(); } },
    { label: "Toggle significant only", key: "S", run: function(){ document.getElementById("f-sig").click(); } },
    { label: "New program from blueprint", key: "N", run: function(){} }
  ].filter(function(c){ return !term || c.label.toLowerCase().indexOf(term) > -1; });

  palItems = progs.map(function(p){ return { kind: "p", p: p }; })
    .concat(cmds.map(function(c){ return { kind: "c", c: c }; }));
  if (palIndex >= palItems.length) palIndex = Math.max(0, palItems.length - 1);

  var html = "";
  if (progs.length){
    html += '<div class="pgroup">Programs</div>';
    progs.forEach(function(p){
      var i = palItems.findIndex(function(x){ return x.kind === "p" && x.p.key === p.key; });
      html += '<div class="pitem" role="option" id="pal-' + i + '" data-i="' + i + '"'
            + ' aria-selected="' + (i === palIndex) + '" data-on="' + (i === palIndex ? 1 : 0) + '">'
            + '<span class="st ' + p.status + '"></span><span>' + p.name + '</span>'
            + '<span class="pk">' + p.blueprint + '</span></div>';
    });
  }
  if (cmds.length){
    html += '<div class="pgroup">Commands</div>';
    cmds.forEach(function(c){
      var i = palItems.findIndex(function(x){ return x.kind === "c" && x.c.label === c.label; });
      html += '<div class="pitem" role="option" id="pal-' + i + '" data-i="' + i + '"'
            + ' aria-selected="' + (i === palIndex) + '" data-on="' + (i === palIndex ? 1 : 0) + '">'
            + '<span style="width:7px"></span><span>' + c.label + '</span>'
            + '<span class="pk">' + c.key + '</span></div>';
    });
  }
  pres.innerHTML = html || '<div class="pempty" role="status">No match for “' + q.value + '”</div>';
  q.setAttribute("aria-activedescendant", palItems.length ? "pal-" + palIndex : "");
  var active = pres.querySelector('[data-on="1"]');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function palRun(){
  var it = palItems[palIndex];
  if (!it) return;
  if (it.kind === "p"){ state.sel = it.p.key; state.live = false; state.onlySig = false;
    document.getElementById("f-live").setAttribute("aria-pressed", "false");
    document.getElementById("f-sig").setAttribute("aria-pressed", "false");
    renderList(); renderDetail(); }
  else it.c.run();
  palClose();
}

q.addEventListener("input", function(){ palIndex = 0; palRender(); });
pres.addEventListener("click", function(e){
  var b = e.target.closest(".pitem"); if (!b) return;
  palIndex = +b.dataset.i; palRun();
});
document.getElementById("open-pal").addEventListener("click", palOpen);
scrim.addEventListener("click", function(e){ if (e.target === scrim) palClose(); });

document.addEventListener("keydown", function(e){
  var open = !scrim.hidden;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); open ? palClose() : palOpen(); return; }
  if (open){
    if (e.key === "Tab"){ e.preventDefault(); q.focus(); return; }  // focus trap
    if (e.key === "Escape"){ palClose(); }
    else if (e.key === "ArrowDown"){ e.preventDefault(); palIndex = Math.min(palItems.length - 1, palIndex + 1); palRender(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); palIndex = Math.max(0, palIndex - 1); palRender(); }
    else if (e.key === "Enter"){ e.preventDefault(); palRun(); }
    return;
  }
  if (e.target.tagName === "INPUT") return;
  if (e.key === "j" || e.key === "ArrowDown"){ e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
});

renderChrome();

/* ── the view chrome ───────────────────────────────────────────────────
   Every view declares its own columns, its own header labels and its own
   footer. It used to declare none of them: five views were added against the
   Programs header, so Spend, Prospects, Signals, Policy and Audit all showed
   PROGRAM · BLUEPRINT · ENROLLED · LIFT · HOLDOUT · P95 over their own data,
   in columns sized for a different table. Values wrapped, rows grew into each
   other, and an email ran into a phone number.

   The right column is a summary rather than a void. Those aggregates used to
   be crammed into the first row of the list, where they were neither a row
   nor a heading and collided with both. */
var VIEWS = {
  programs: {
    title: "Programs", filters: true,
    cols: "22px minmax(140px,1.35fr) minmax(120px,.95fr) 70px 78px 58px 56px 26px",
    head: ["", "Program", "Blueprint", "r:Enrolled", "r:Lift", "r:Holdout", "r:p95", ""]
  },
