# Deployment on Fly, with Postgres somewhere else.
#
# The API and the worker are two processes from one image, because they share
# the code and differ only in the command.
#
# The database is not Fly's. A managed Postgres — Neon, Supabase, RDS — is
# reached by a URL this app is given, and nothing here creates or attaches one:
# `fly postgres attach` sets DATABASE_URL, which this runtime deliberately does
# not read. A database URL is named explicitly or it is absent, because a
# runtime that silently picks up whichever connection string happens to be in
# the environment will one day pick up the wrong one.
#
# Three secrets, set once:
#
#   fly secrets set \
#     ZOLTS_DATABASE_URL='postgresql://owner:...@ep-x.eu-central-1.aws.neon.tech/zolts?sslmode=require' \
#     ZOLTS_APP_DATABASE_URL='postgresql://zolts_app:...@ep-x.eu-central-1.aws.neon.tech/zolts?sslmode=require' \
#     ZOLTS_SECRET_KEY="$(openssl rand -hex 32)"
#
# ZOLTS_APP_DATABASE_URL points at a role that cannot bypass row-level security.
# Running the application as the owner passes every test and removes the second
# lock, so `preflight` refuses to release a production deployment without it.
app = "zolts"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrate, then refuse to release a misconfigured runtime. Preflight exits
  # non-zero on a published secret key, an unencrypted database connection, an
  # application role that can bypass row-level security, a pending migration, a
  # tenant-scoped table without FORCE, or a query with no tenant that returns
  # rows instead of raising. A deploy that fails here never takes traffic.
  release_command = "sh -c 'python3 -m runtime.cli migrate && python3 -m runtime.cli preflight'"

[env]
  ZOLTS_ENV = "production"

[processes]
  api = "python3 -m runtime.cli serve --host 0.0.0.0 --port 8080"
  worker = "python3 -m runtime.cli worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # the worker holds leases; stopping it mid-flight
  auto_start_machines = true     # relies on lease expiry to recover, which is slower
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
