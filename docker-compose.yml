# A complete local deployment: database, migrations, API, worker.
#
#   ZOLTS_SECRET_KEY=$(openssl rand -hex 32) docker compose up
#
# The application connects as `zolts_app`, a role that cannot bypass row-level
# security. Running it as the owner would pass every test and remove the second
# lock, so the split exists even in the local stack.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zolts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zolts}
      POSTGRES_DB: zolts
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zolts']
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ['python3', '-m', 'runtime.cli', 'migrate']
    environment: &env
      ZOLTS_DATABASE_URL: postgresql://zolts:${POSTGRES_PASSWORD:-zolts}@postgres:5432/zolts
      ZOLTS_APP_DATABASE_URL: postgresql://zolts_app:${APP_PASSWORD:-zolts_app}@postgres:5432/zolts
      ZOLTS_SECRET_KEY: ${ZOLTS_SECRET_KEY:?set ZOLTS_SECRET_KEY, e.g. openssl rand -hex 32}
      ZOLTS_ENV: ${ZOLTS_ENV:-development}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    ports: ['8000:8000']
    environment: *env
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ['python3', '-m', 'runtime.cli', 'worker']
    environment: *env
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
